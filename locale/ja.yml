        reactions_help: discourse-reactions と同様に、投稿バーに絵文字の集計を表示します。
        polls_label: 投票
        polls_help: 'Discourse の投票グリッドで表示：結果バーと、その横に大きな投票数。'
        links_sidebar_label: サイドバーのリンク
        links_sidebar_help: Discourse のカスタムリンクと同様に、FoF Links をヘッダーからサイドバーのセクションに移動します。
        upload_progress_label: アップロードの進捗
        upload_progress_help: Discourse と同様に、FoF Upload のファイル送信中にエディターに「アップロード中…」バーを表示します。
        profile_cover_label: プロフィールカバー（forumaker/profile-cover）
        profile_cover_help: 'テーマ独自のカバーの代わりに拡張機能のカバーを使います。プロフィールのバナー、ユーザーカードの背景（サムネイルがあればサムネイル）に、拡張機能のエディターで選んだ位置で表示します。エディターはプロフィールの「…」メニューと設定から開きます。テーマ独自の画像は保存されたままで、このスイッチをオフにすると元に戻ります。'
        thumbnails_label: 一覧のサムネイル
        thumbnails_help: Discourse が独自のサムネイルを表示する位置に、スレッド一覧のタイトルの横に FoF Discussion Thumbnail の画像を表示します。
        verified_label: 認証バッジ
        verified_help: 'ramon/verified のバッジを、Discourse のユーザーアイコンのように名前のすぐ後ろ、文字と同じ行・同じ大きさで表示します（投稿ヘッダー、埋め込み投稿、「返信先」、ユーザーカード、プロフィール）。'
        wiki_label: 'テーマに合わせた Wiki'
        wiki_help: 'linkrobins/wiki の Wiki を Discourse の見た目にします。目次はディスカッション一覧のように、記事は最初の投稿のように（マップと履歴つき）、執筆はディスカッションのコンポーザー（下書き、詳細オプション、よくある質問つき）で行い、サイドバーのコミュニティセクションに「Wiki」リンクを置きます。'
        ramon_chat_label: Discourse スタイルのチャット（ramon/chat）
        ramon_chat_help: 'ramon/chat 拡張機能を Discourse のチャットのように表示します：2 列目のないページ、ドロワー、メッセージ、エディター、スレッド、チャンネル画面。拡張機能が有効な場合、テーマ独自のチャットはこちらに切り替わります。'
        ramon_chat_sidebar_label: サイドバーのチャンネル
        ramon_chat_sidebar_help: 'テーマのサイドバーに「チャンネル」と「ダイレクトメッセージ」セクション（「マイスレッド」「検索」「保存済み」付き）を表示し、チャットページの独自のチャンネル列をなくします。'
        ramon_chat_notifications_label: ユーザーメニューの「チャット」タブ
        ramon_chat_notifications_help: チャットの通知（招待、メンション、モデレーション）をユーザーメニューの専用タブに表示します。
        ramon_chat_user_button_label: ユーザーカードとプロフィールの「チャット」ボタン
        ramon_chat_user_button_help: '「…」メニューの項目ではなく、ユーザーカードとプロフィールの「チャット」ボタンからダイレクト会話を開きます。flarum/messages が有効な場合は効果がありません（その場合、プライベートな会話は「メッセージ」になります）。'
        marketplace_label: ストア（ramon/marketplace）をテーマの見た目で
        marketplace_help: 'ストアのページ（ストアフロント、商品、カート、チェックアウト、注文、ダウンロード、販売者ダッシュボード、コース、プラン）をテーマのカード内に表示します。タイトルはヒーローのように、ボタン・入力欄・タブ・モーダルはテーマのものを使い、色はプライマリカラーから派生し、アイコンは Lucide になります。'
        marketplace_sidebar_label: 'サイドバーの「ストア」セクション'
        marketplace_sidebar_help: 'ストアのリンク（マーケットプレイス、カート、注文、ダウンロード、ウィッシュリストなど）を、「ストア」にマウスを乗せると開いていたメニューの代わりに、折りたためるサイドバーのセクションに表示します。'
      group_ai: AI
      ai:
        translation_enabled_label: 自動翻訳
        translation_enabled_help: 読者と異なる言語で書かれた投稿とタイトルは、最初に読まれたときに AI が翻訳し、全員のために保存します。日付の横の 文A で翻訳と原文を切り替えます。翻訳される投稿ごとに高速モデルを1回呼び出します。
        translation_locales_label: 翻訳先の言語
        translation_locales_help: 読者の言語は、その人の設定で選んだ言語です（ゲストはフォーラムの言語）。チェックされていない言語の読者には常に原文が表示されます。
        translation_titles_label: タイトルを翻訳
        translation_titles_help: スレッドのタイトルも、一覧とスレッド内で、ページ全体を1回の呼び出しで翻訳します。
        translation_public_only_label: 公開コンテンツのみ
        translation_public_only_help: ゲストも閲覧できるものだけを翻訳します。オフにすると、制限付きタグもモデルに送られます（メッセージや非表示の投稿は送られません）。
        translation_daily_limit_label: 1日あたりの呼び出し回数（フォーラム全体）
        translation_daily_limit_help: 翻訳される投稿、タイトルのまとまり、言語検出のまとまりがそれぞれ1回と数えられます。上限に達すると、翌日まで原文が表示されます。0 = 無制限。
        requires_provider: まず「プロバイダーとモデル」カードでプロバイダーとキーを設定してください。
        key_saved: ••••••••（キー保存済み。入力すると置き換えます）
        key_clear: 保存済みのキーを削除
        test_button: 接続をテスト
        persona_off: 'オフ'
        persona_name: 名前
        persona_id: 識別子（英字、数字、_ と -）
        persona_description: 説明（セレクターに表示）
        persona_prompt: システムプロンプト
        persona_enabled: 有効
        persona_search: フォーラムを検索可能
        persona_read: スレッドを閲覧可能
        persona_web: Web を検索可能（Anthropic のみ。検索ごとに課金）
        persona_remove: ペルソナを削除
        persona_add: 新しいペルソナ
        persona_restore: デフォルトに戻す
        default_persona_label: デフォルトのペルソナ
        default_persona_help: 「新しい質問」と検索の「AI に質問」で最初に選択されているペルソナ。
        persona_new_name: 新しいペルソナ
        schema_missing: 'AI のテーブルがまだ作成されていません：「php flarum migrate」を実行してください。それまで機能は非表示のままです。'
        not_configured: API キーがない場合、AI 機能はフォーラムで非表示のままです。下記でプロバイダーを設定し、「接続をテスト」を使用してください。
        provider_title: プロバイダーとモデル
        provider_label: プロバイダー
        provider_help: デフォルトは Anthropic（Claude）です。「OpenAI 互換」は OpenAI および同じ API を持つ任意のサービス（OpenRouter、Groq、Mistral、DeepSeek、Ollama、LM Studio…）で動作します。
        provider_anthropic: Anthropic（Claude）
        provider_openai: OpenAI 互換
        anthropic_key_label: Anthropic API キー
        anthropic_key_help: console.anthropic.com → API Keys で作成します。キーはサーバーに保存され、フォーラム側に送られることはありません。
        model_label: メインモデル
        anthropic_model_help: ボット、概要、書き換えを行うヘルパーモード（説明、カスタムプロンプト）で使用します。Sonnet は品質とコストのバランスが良く、Opus が最も高性能です。
        fast_model_label: 高速モデル
        fast_model_help: '短いタスク用：会話のタイトル、校正、翻訳、タイトルとタグの提案、一覧の要旨。'
        openai_url_label: API ベース URL
        openai_url_help: /v1 までのアドレス。テーマが /chat/completions を付加します。例：https://api.openai.com/v1、https://openrouter.ai/api/v1、http://localhost:11434/v1。
        openai_key_label: API キー
        openai_key_help: '「Authorization: Bearer」として送信されます。ローカルサーバーではキーが不要な場合があります。'
        openai_fast_help: 空欄の場合はメインモデルを使用します。
        features_title: 機能
        summary_min_posts_label: 概要を作成する最小投稿数
        summary_min_posts_help: これより小さいスレッドにはボタンが表示されません。
        personas_title: ペルソナ
        personas_help: 各ペルソナには名前、説明、システムプロンプト、使用できるツールがあります。ユーザーは質問欄の下でペルソナを選びます。
        access_title: アクセスと制限
        allowed_groups_label: ボット、ヘルパー、「AI に質問」を使用できるユーザー
        allowed_groups_help: '「メンバー」はメールアドレスを確認済みのすべてのユーザーです。管理者は常に使用できます。'
        summary_groups_label: スレッドの概要を生成できるユーザー
        summary_groups_help: 完成した概要は、スレッドを閲覧できる人なら誰でも（ゲストを含む）読めます。
        daily_limit_label: 1人1日あたりのリクエスト数
        daily_limit_help: ボットへの質問、ヘルパーの使用、概要の生成がそれぞれ1回と数えられます。0 = 無制限。管理者には制限がありません。
        embeddings_title: 埋め込み
        requires_related: 「機能」カードで「関連スレッド」を有効にしてください。
        embeddings_help: 'Anthropic には埋め込み API がありません：OpenAI 互換のもの（OpenAI、Voyage、Mistral、Ollama…）を使用してください。すべてを一括で埋め込むには「php flarum canela:ai-embeddings --all」。'
        embeddings_url_label: 埋め込み API の URL
        embeddings_key_label: API キー
        embeddings_model_label: モデル
        enabled_label: AI を有効にする
        enabled_help: オフにすると、フォーラムに AI 機能は一切表示されず、AI API は 404 を返します。
        bot_enabled_label: AI ボット（会話）
        bot_enabled_help: /ai/conversations ページ：AI への質問、サイドバーの会話一覧、ペルソナ、ストリーミングされる回答。許可されたペルソナでは、AI がフォーラムを検索・閲覧し（そのユーザーが閲覧できるもののみ）、スレッドを引用します。
        bot_header_icon_label: ヘッダーのロボットアイコン
        bot_header_icon_help: 会話を開きます。会話内では、元いた場所に戻ります。
        bot_sidebar_link_label: 'サイドバーの「AI ボット」リンク'
        bot_sidebar_link_help: コミュニティセクション内。
        search_enabled_label: 検索で AI に質問
        search_enabled_help: '検索欄が「検索または AI に質問」になり、検索モーダルに「AI に質問：<query>」が表示され、会話が開きます。'
        helper_enabled_label: エディターの AI ヘルパー
        helper_enabled_help: エディターのツールバーの ✨ ボタン：校正、翻訳、簡潔化、説明、表の生成、カスタムプロンプト、タイトルの提案、タグの提案。変更のプレビューと「確定／破棄」付き。
        summary_enabled_label: スレッドの概要
        summary_enabled_help: スレッドマップの「要約」ボタンで、ストリーミングされる概要のパネルが開きます。概要は保存され、スレッドを閲覧できる全員が読めます。スレッドに新しい返信がつくと、「再生成」とともに古い概要として表示されます。
        gists_enabled_label: 一覧の要旨
        gists_enabled_help: 最もアクティブなスレッドで、抜粋の代わりに AI が書いた一文を表示します。スケジューラー（cron で「php flarum schedule:run」）により1時間ごとに、1回の実行で最大20件生成されます。1件ごとに高速モデルを1回呼び出します。
        related_enabled_label: 関連スレッド（埋め込み）
        related_enabled_help: スレッドの末尾に、意味の近いスレッドを表示します。埋め込み API が必要です（ここで設定し、機能を有効にしてください）。ベクトルは1時間ごと、および各スレッドの初回訪問時に生成されます。
      auth:
        pages_label: 全画面のログインと新規登録
        pages_help: Discourse と同様に、ヘッダーの「ログイン」と「新規登録」ボタンで /login と /signup ページを開きます。オフにするとモーダルが開きます。
      bookmarks:
        title: ブックマーク
        bookmarks_enabled_label: ブックマーク
        bookmarks_enabled_help: メンバーは後で戻るために投稿をブックマークでき、名前とリマインダーは任意で設定できます。ブックマークはすべて自分のプロフィールの「ブックマーク」タブで確認できます。オフにするとボタンは消え、API は機能が存在しないかのように応答します。既存のブックマークは保持されます。
        bookmarks_topic_button_label: スレッドをブックマーク
        bookmarks_topic_button_help: スレッドのコントロール（フッターの「…」メニュー）に「スレッドをブックマーク」を追加します。Discourse と同様に、最初の投稿をブックマークします。
        bookmarks_user_menu_label: ユーザーメニューの項目
        bookmarks_user_menu_help: アバターメニューの「プロフィール」のすぐ下に「ブックマーク」のショートカットを追加します。
        reminders_notice: リマインダーは Flarum のスケジューラーにより5分ごとに送信されます。サーバーで cron から毎分「php flarum schedule:run」を実行する必要があります。cron がなくてもブックマークは動作しますが、リマインダーは送信されません。
      composer:
        section_editor: Discourse の投稿エディター
        enabled_label: Discourse の投稿エディター機能
        enabled_help: 'マスタースイッチ：オフにすると、エディターは通常の Flarum のものになり、以下の機能はすべて無効になります。'
        emoji_label: 絵文字ピッカー
        emoji_help: ツールバーの絵文字ボタンで、検索、カテゴリー、最近使用したもの、肌の色を備えたピッカーが開きます。Emoji 拡張機能がある場合、絵文字はその画像で表示されます。
        emoji_notice: 'Emoji 拡張機能が無効です：ピッカーはシステムの絵文字を使用し、「:name」の自動補完はテーマが提供します。'
        preview_label: 横並びのプレビュー
        preview_help: デスクトップでは、整形された投稿がエディターの右側に表示されます。エディターの隅にある « ボタンで誰でも非表示にできます。
        similar_label: 類似スレッド
        similar_help: 新しいスレッドのタイトルを入力中（3語以上）に、「あなたのスレッドは次のスレッドと似ています…」と関連スレッドを最大5件表示します。
        linked_topic_label: リンクしたスレッドとして返信
        linked_topic_help: 返信エディターの「↩ ▾」メニューで、返信を同じ本文、元へのリンク、同じタグを持つ新しいスレッドに変換します。
        section_drafts: 下書き
        drafts_label: 下書き（fof/drafts）
        drafts_help: FoF Drafts 拡張機能があると、テーマは Discourse 方式で下書きを表示します：新しいスレッドと返信は入力が止まってから2秒後に自動保存され、スレッドに返信すると下書きが再開され、本文がある状態で閉じると破棄するか保持するかを尋ね、「スレッドの作成」ボタンに一覧を開く ⌄ が付きます。下書きはユーザーメニューとプロフィールの「下書き」タブにも表示されます。
        drafts_note: 下書きは fof/drafts（drafts テーブル）が保存し、権限と予約投稿も管理します。投稿の編集には下書きがありません。
        section_hashtags: '#タグ'
        hashtags_label: タグのハッシュタグ
        hashtags_help: 'エディターで # を入力するとタグを候補表示してそのリンクを挿入します。投稿内では、これらのリンク（および Mentions 拡張機能のタグメンション）がタグの記号付きのラベルになります。'
        hashtags_mentions_notice: 'Mentions 拡張機能が有効な場合、エディターの # はその拡張機能のもの（タグメンション）になります。テーマはメンションを Discourse のハッシュタグとして描画するだけです。'
        requires_composer: 投稿エディター機能が無効です（上の「Discourse の投稿エディター」カード）。
      extras:
        search_title: 検索ページ
        search_page_enabled_label: 高度な検索ページ
        search_page_enabled_help: Discourse の /search ページ：スレッド、投稿、タグ、ユーザーのタブ、高度なフィルター（投稿者、プライマリタグ、タグ、タイトルのみ、いいね済み、ステータス、日付、最小投稿数）と並べ替え。検索モーダルに「高度な検索」リンクが追加されます。
        search_notice: 'フィルターは検索に入力できるショートカットにもなります：in:title、in:likes、in:bookmarks、min-posts:5 と、Flarum 標準のもの（author:、tag:、is:locked…）。'
        bulk_title: 一括選択
        bulk_select_enabled_label: モデレーター向けの一括選択
        bulk_select_enabled_help: 一覧のバーにあるボタンで、各スレッドのチェックボックスと操作バーが表示されます：既読にする、固定、クローズ、タグの変更、非表示、削除。一覧内のいずれかのスレッドをモデレートできるユーザーにのみ表示され、各操作は権限がある場合にのみ適用されます。
        top_periods_title: 期間別の人気
        top_periods_enabled_label: 人気タブの期間セレクター
        top_periods_enabled_help: 人気タブに「全期間／年／四半期／月／週／今日」を表示し、その期間に作成されたスレッドに一覧を絞り込みます。
        text_size_title: 文字サイズ
        text_size_enabled_label: 文字サイズの選択
        text_size_enabled_help: 設定で、各ユーザーが「小」「標準」「大」「特大」から選べます。Discourse と同様に、選択はデバイスごとに適用されます（ブラウザーに保存）。
        banner_title: お知らせバナー
        banner_enabled_label: バナーを表示
        banner_enabled_help: すべてのページのコンテンツの上に、閉じるボタン付きの帯を表示します。閉じたユーザーには、文章が変更されるまで再表示されません。
        banner_text_label: バナーの文章
        banner_text_help: 投稿と同様に Markdown、BBCode、絵文字に対応。HTML にするには、文章を HTML タグ（p、div…）で始めてください。空欄の場合、バナーは表示されません。
        banner_reshow: 閉じたユーザーにも再表示
        banner_reshow_done: バナーは全員に再表示されます。
        print_title: スレッドを印刷
        print_topic_enabled_label: スレッドのコントロールに「印刷」項目
        print_topic_enabled_help: すべての投稿をすっきりした表示（サイドバー、ヘッダー、タイムラインなし）で読み込み、ブラウザーの印刷ダイアログを開きます。PDF として保存することもできます。
        history_title: 編集履歴
        post_history_enabled_label: 編集履歴を保存・表示
        post_history_enabled_help: 編集のたびに以前の文章を保持します。投稿の「編集済み」が改訂回数付きの鉛筆アイコンになり、バージョン間の比較（インラインまたは横並び）を開きます。
        history_notice: 記録されるのは機能が有効な間に行われた編集のみです。オフにすると新しい履歴は保存されず、フォーラムから履歴が消えますが、保存済みのものはデータベースに残ります。非表示の投稿のバージョンの文章は、その投稿を編集できるユーザーにのみ表示されます。
      section_icons: アイコン
      lucide_icons_label: Discourse のアイコン（Lucide）
      lucide_icons_help: インターフェースのアイコン（検索、ベル、返信、いいね、メニュー…）を meta.discourse.org と同様に Lucide の細い線で描画します。オフにすると、塗りつぶしの Font Awesome アイコンに戻ります。Meta が置き換えないアイコン（ブランドや、タグとグループ用に選ばれた一部のアイコン）は Font Awesome のままです。
      metoo:
        title: 私も
        enabled_label: '最初の投稿の「私も」ボタン'
        enabled_help: Discourse Meta と同様の、最初の投稿の下にある「✋ 私も」ボタン：同じ問題を抱えるユーザーがクリックすると、件数が括弧内に表示され、スレッドをフォローし始めます。投稿者とロックされたスレッドでは読み取り専用のボタンになり、ゲストはログインに誘導されます。オフにするとボタンは消え、API は 404 を返します。既存のマークは保持されます。
        tags_label: ボタンを表示する場所
        tags_help: サポート用のタグにチェックを入れてください（Discourse Meta では Support、Bug…）。何もチェックしない場合はすべてのスレッドが対象です。親タグにチェックを入れると子タグも含まれます。
        tags_loading: タグを読み込み中…
        tags_some: '{count, plural, one {# 件選択中} other {# 件選択中}}'
        tags_all: すべてのタグ
        tags_clear: クリア（すべて）
        hide_solved_label: スレッドが解決済みになったら非表示
        hide_solved_help: ベストアンサーが選ばれると（FoF Best Answer）ボタンは消え、解決策が取り消されると再び表示されます（Discourse のデフォルト）。オフにすると、解決済みのスレッドにも表示されたままになります（プラグインの「複数の解決策」）。
        follow_label: クリックでスレッドをフォロー
        follow_help: 「私も」をクリックすると、解決策を知らせるためにそのユーザーがスレッドをフォローします（Subscriptions 拡張機能）。Discourse の「追跡中」と同様です。すでにフォロー中のユーザーはそのままで、マークを外してもフォローは解除されません。
        no_best_answer_notice: FoF Best Answer 拡張機能がない場合、解決済みとみなされるスレッドはありません：選択したすべてのスレッドにボタンが表示されたままになります。
      profile:
        blocked_by_master: 「拡張プロフィール」カードで追加フィールドを有効にしてください。
        characters_suffix: 文字
        section_main: 拡張プロフィール
        profile_enabled_label: 追加のプロフィールフィールド
        profile_enabled_help: 'Discourse のプロフィールフィールド：誰もが自分が誰で、どこにいて、何をしているかを伝えられます。オフにすると、フィールドはフォーラムと API から消えますが、入力済みの内容は保持されます。'
        profile_bio_label: 自己紹介
        profile_bio_help: プロフィールとユーザーカードに表示される短い文章。リンク、**太字**、*斜体*、`code` に対応。HTML は使用できません。
        profile_bio_max_length_label: 自己紹介の最大文字数
        profile_bio_max_length_help: '{min}〜{max} 文字。'
        profile_location_label: 所在地
        profile_location_help: 市区町村または地域。プロフィールに地図アイコン付きで表示されます。
        profile_website_label: ウェブサイト
        profile_website_help: http または https のアドレス。新しいタブで開き、nofollow が付きます。
        profile_birthday_label: 誕生日
        profile_birthday_help: 任意の生年月日。本人が年を表示することを選ばない限り、他のユーザーには月日のみが表示されます。
        section_title: ユーザーの肩書き
        profile_title_label: 名前の下の肩書き
        profile_title_help: プロフィール、ユーザーカード、投稿の名前の横に表示される短い肩書き（60文字まで）。
        profile_title_self_label: 各自が自分の肩書きを選ぶ
        profile_title_self_help: オフにすると、ユーザーを編集できるユーザー（モデレーター）だけが肩書きを設定します。スタッフから与えられる称号となります。
        section_status: ユーザーステータス
        profile_status_label: 絵文字付きステータス
        profile_status_help: 絵文字とひとこと（「🌴 金曜日まで休暇中」）を、投稿の名前の横、カード、ヘッダーのアバターに表示します。ステータスが自動で消える時期は各ユーザーが選べます。
        section_cover: カバーとカードの背景
        profile_cover_label: プロフィール画像
        profile_cover_help: Discourse と同様に、プロフィール上部のワイドなカバーとユーザーカードの背景です。画像がない場合、カバーにはユーザーの色が使われます。
        profile_cover_upload_label: 画像のアップロードを許可
        profile_cover_upload_help: 画像は縮小され（カバーは 2000px、カードは 900px）、WebP に変換されて assets/canela-covers に保存されます。無効の場合は https の画像アドレスのみ受け付けます。
        cover_notice: 外部アドレスは https である必要があります。訪問者のブラウザーは画像を相手のサイトから直接読み込みます。
        cover_forumaker_notice: 'forumaker/profile-cover が有効です。プロフィールカバーはこの拡張機能から表示されます（連携 → プロフィールカバー）。カードの背景は引き続きテーマのものです。独自の背景がない場合、カードはそのカバーのサムネイルを使います。ここでアップロードしたカバーは保存されたままですが、拡張機能が有効な間は表示されません。'
      stats:
        section_links: リンクのクリック
        stats_links_enabled_label: リンクのクリックを数える
        stats_links_enabled_help: Discourse と同様に、投稿内の外部リンクへのクリックをすべて数えます。数はリンクの横、スレッドマップの「人気のリンク」、プロフィール概要の「トップリンク」に表示されます。
        links_notice: 1 人（ゲストは IP）につき 1 リンクあたり 24 時間に 1 クリックまでです。ボットは数えません。対象は投稿内にある外部リンクのみです。
        section_views: スレッドの閲覧数
        stats_views_enabled_label: 閲覧数を数える
        stats_views_enabled_help: Discourse と同様に、各スレッドが開かれた回数を数えます。数は一覧の閲覧数の列に表示され、閲覧数の多い順に並べ替えられます。
        stats_view_window_hours_label: 同じ人を再度数えるまでの時間
        stats_view_window_hours_help: スレッドの新しい閲覧を IP／ユーザーごとに N 時間に 1 回数えます。Discourse と同様に、日付が変わると必ず再度数えます（topic_view_duration_hours）。{min}〜{max} 時間。Discourse は 8 を使用します。
        hours_suffix: 時間
        views_notice: Discourse と同様です：各アカウント（ゲストは IP）につき 1 スレッドあたり 1 日 1 閲覧で、上記の時間で制限されます。スレッドを閲覧できる人のみ数え、クローラーは数えません。ログイン中のユーザーの IP は保存されず、ゲストの IP はソルト付きのコードとしてのみ保持され、IP そのものは保存されません。各日の値はスレッドマップの「最近の閲覧数」グラフのために保持されます。
        heat_title: 閲覧数の列のハイライト
        heat_help: 一覧の閲覧数の列のヒートカラー（Discourse のヒートマップ）です。スレッド一覧で「多い数をハイライト」が有効なときに適用されます。
        topic_views_heat_low_label: 弱いハイライトの開始値
        topic_views_heat_low_help: この閲覧数を超えると、閲覧数の欄が少しハイライトされます。Discourse は 1000 を使用します。
        topic_views_heat_medium_label: 中程度のハイライトの開始値
        topic_views_heat_medium_help: この閲覧数を超えると、閲覧数の欄が中程度にハイライトされます。Discourse は 2000 を使用します。
        topic_views_heat_high_label: 強いハイライトの開始値
        topic_views_heat_high_help: この閲覧数を超えると、閲覧数の欄が強くハイライトされます。Discourse は 3500 を使用します。
        views_suffix: 閲覧
        section_counts: 新着と未読の件数
        stats_counts_enabled_label: 件数を表示
        stats_counts_enabled_help: ログイン中のユーザー向け：一覧のタブに「新着 (3)」「未読 (2)」を表示し、新しいものがあるときはサイドバーの「すべてのスレッド」の横に点を表示します。
        stats_new_days_label: スレッドが新着扱いになる日数
        stats_new_days_help: この期間に作成され、まだ開いていないスレッドです。0 にすると、登録時または最後の「すべて既読にする」以降のすべてを数えます。{min}〜{max}。Discourse は 2 を使用します。
        days_suffix: 日
        section_activity: プロフィールのアクティビティ
        stats_activity_enabled_label: アクティビティを記録
        stats_activity_enabled_help: Discourse と同様に、訪問日数、閲覧時間（合計と直近 60 日）、読んだ投稿、閲覧したスレッド、送った・受け取ったいいねをプロフィール概要に表示します。
        activity_notice: 閲覧時間はタブが表示されていて、誰かがページを使用している間のみ数えます。数値はこの機能を有効にした日からゼロで始まります。閲覧したスレッドは閲覧数が有効であることが前提です。
      ramon_chat_features:
        group_moderation: "モデレーション"
        review_flags_label: "「レビュー」にチャットの通報"
        review_flags_help: "通報されたチャットメッセージを、投稿と一緒に日付順でテーマのレビューキュー（ページ、サイドバー、ユーザーメニュー）に表示します。通報を閲覧できる人、またはチャットのモデレーター向けです。"
        title: "チャットの追加機能（ramon/chat）"
        description: "Discourse のチャットにあって ramon/chat にないもの：ベルの通知、ワンクリックリアクション、「新しいメッセージ」、お気に入り、メッセージのリンク、WebSocket なしの「入力中」など。拡張機能は変更しません。"
        backend_off: "テーマの「ramonchat」機能が有効になっていません（extend/.enabled）。"
        group_reader: "読者向け"
        group_messages: "メッセージ"
        group_channels: "チャンネルと DM"
        dm_max_label: "DM あたりの参加者数"
        dm_max_help: "会話を始める人を含みます。ramon/chat の上限は 20 です。"
        preferences_label: "設定の「チャット」セクション"
        preferences_help: "チャットの有効化、サウンド、ヘッダーのインジケーター、送信キー、ワンクリックリアクション、ドロワー、メンションのメール、「チャンネル全体へのメンションを無視」。"
        header_indicator_label: "ヘッダーインジケーターの設定"
        header_indicator_help: "チャットボタンが数えるものを各自が選びます：すべての新着、DM とメンション、メンションのみ、なし。"
        drawer_shortcut_label: "ドロワーのショートカット「-」"
        drawer_shortcut_help: "Discourse と同じく、チャットのドロワーを開閉します。"
        bell_label: "ベルの通知"
        bell_help: "メンション（@here は直近 5 分以内にアクティブな人のみ）とウォッチ中のチャンネルの新着が通知になります。チャンネルを読むと既読になります。"
        quick_reactions_label: "ワンクリックリアクション"
        quick_reactions_help: "よく使う 3 つのリアクション（または自分で選んだもの）を 👍 の横に表示します。"
        permalink_label: "メッセージのリンク"
        permalink_help: "アクションの「リンクをコピー」と、会話をそのメッセージで開くアドレス。"
        restore_label: "削除したメッセージの復元"
        restore_help: "削除済みメッセージの表示に、復元できる人向けのボタンを追加します。"
        long_press_label: "スマートフォンでの長押し操作"
        long_press_help: "メッセージを長押しすると、下からアクションシートが開きます。"
        collapse_deleted_label: "連続した削除済みメッセージをまとめる"
        collapse_deleted_help: "「N 件のメッセージが削除されました」を 1 行にまとめ、「すべて表示」を付けます。"
        paste_upload_label: "画像の貼り付けとドロップ"
        paste_upload_help: "エディターに貼り付けた・ドロップした画像やファイルを添付としてアップロードします。"
        mention_warning_label: "メンバー外の警告"
        mention_warning_help: "エディターの @ 候補で、チャンネル外の人に「チャンネルのメンバーではありません」と表示します。"
        typing_poll_label: "WebSocket なしの「入力中」"
        typing_poll_help: "flarum/realtime がない場合、会話を開いている人が 3 秒ごとにサーバーに問い合わせます。"
        new_message_label: "「新しいメッセージ」"
        new_message_help: "DM とグループ DM のダイアログ（ユーザー検索、カウンター、グループ名）と「ダイレクトメッセージ」の「+」。"
        self_dm_label: "自分宛ての DM（「メモする」）"
        self_dm_help: "メモ用の自分だけの会話。"
        group_name_label: "グループチャットの名前"
        group_name_help: "参加者なら誰でもグループの会話名を変更できます。"
        starred_label: "お気に入りチャンネル"
        starred_help: "ヘッダーとチャンネル情報のスター。お気に入りはサイドバーの上に並びます。"
        pin_indicator_label: "未読のピン留め"
        pin_indicator_help: "まだ開いていないピン留めがあると、ピン留めバーに点を表示します。"
        retention_label: "保持期間の表示"
        retention_help: "メッセージの保持期間をチャンネル情報に表示します。"
        delete_confirm_label: "名前を入力してチャンネルを削除"
        delete_confirm_help: "チャンネルの削除時に「OK」ではなくチャンネル名の入力を求めます。"
        auto_join_label: "自動参加チャンネルへの遅延参加"
        auto_join_help: "後からアクセス権を得た人も「ユーザーを自動追加」のチャンネルに参加します（1 人につき 1 日 1 回まで）。"
        tag_cleanup_label: 削除したタグのチャンネルを削除
        tag_cleanup_help: タグを削除すると、そのチャンネルも削除されます。
        dm_guard_label: "DM のルール"
        dm_guard_help: "チャットを使えない人やオフにした人との DM を拒否し、下の参加者数の上限を適用します。"
    system_user:
      title: "システムユーザー"
      help: "Discourse の「system」と同じく、自動通知（ブックマークのリマインダーとバッジ）と下の自動メッセージの送信者になります。フォーラムではプロフィール・アバター・自己紹介を持つ普通のユーザーですが、ログインは一切できません（ログイン、パスワード、パスワード再設定、セッションなし）。誰もメッセージを送れず、ユーザー一覧にも表示されません。"
      bio: "実在の人物ではありません。システム通知やその他のシステム作業のための共通ユーザーです。"
      create: "システムユーザーを作成"
      created_as: "システムユーザー：{name}"
      open_profile: "プロフィールを開く"
      profile_hint: "アバター、名前、自己紹介は、ほかのユーザーと同じくプロフィールから変更します。"
      unlink: "解除"
      unlink_confirm: "システムユーザーを解除しますか？アカウントは残りますが、通知は送信者なしに戻り、別のユーザーを作成または設定するまで自動メッセージは止まります。"
      missing: "システムユーザーはまだありません。ない場合、自動通知は送信者なしになり、自動メッセージは送られません。"
      messages_notice: "自動メッセージはプライベートメッセージです。メッセージ拡張（flarum/messages）が有効である必要があります。"
      needs_user: "先にシステムユーザーを作成してください（上のカード）。"
      no_replies_notice: "システムユーザーとの会話は一方通行です。受信箱を読む人がいないため、受信者は返信できません。"
    sysmsg:
      fields:
        subject: "件名"
        body: "本文"
        default_hint: "空欄の場合は既定の文章（欄に灰色で表示）が、受信者の言語で使われます。"
        use_default: "既定の文章から編集"
        restore_default: "既定に戻す"
        variables: "変数：{list}"
      welcome_user:
        title: "歓迎"
        help: "アカウントを有効化した人（メールを確認した、または確認済みで登録した）に送ります。1人につき1回だけです。"
        subject: "%{site_name} へようこそ！"
        body: |-
          %{site_name} に参加していただきありがとうございます。ようこそ！

          私たちは常に[礼儀正しいコミュニティ](%{guidelines_url})を大切にしています。

          お楽しみください！
      welcome_invite:
        title: "招待による歓迎"
        help: "招待リンクから参加した人に、通常の歓迎の代わりに送ります。"
        subject: "%{site_name} へようこそ！"
        body: |-
          %{site_name} への招待を受けていただきありがとうございます。ようこそ！

          - アカウント **%{username}** を作成しました。名前やパスワードは[設定](%{user_preferences_url})で変更できます。

          私たちは常に[礼儀正しいコミュニティ](%{guidelines_url})を大切にしています。

          お楽しみください！
      welcome_tl1_user:
        title: "信頼レベル1"
        help: "信頼レベル1（ベーシック）に上がったときに送ります。信頼レベルが有効である必要があります。"
        subject: "一緒に過ごしてくれてありがとうございます"
        body: |-
          こんにちは！たくさん読んでいただいているので、信頼レベルを1つ上げました！

          一緒に過ごしてくださってうれしいです。あなたのことをもっと知りたいので、[プロフィールを記入](%{user_url})したり、気軽に[スレッドを始めて](%{base_url})みてください。
      tl2_promotion_message:
        title: "信頼レベル2"
        help: "信頼レベル2（メンバー）に上がったときに送ります。信頼レベルが有効である必要があります。"
        subject: "信頼レベルの昇格おめでとうございます！"
        body: |-
          信頼レベルをもう1つ上げました！

          信頼レベル2は、このコミュニティのメンバーと認められるほど読み、積極的に参加したことを意味します。

          これからも参加してください。あなたがいてくれてうれしいです。
      welcome_staff:
        title: "スタッフに参加"
        help: "管理者またはモデレーターのグループに入ったときに送ります。"
        subject: "おめでとうございます。%{role} になりました！"
        body: |-
          ほかのスタッフから %{role} の役割を与えられました。

          スタッフ用のツールが使えるようになります。大きな力には大きな責任が伴います。モデレーションが初めての場合は[コミュニティガイドライン](%{guidelines_url})を読んでください。
      user_added_to_group_as_member:
        title: "グループに追加"
        help: "ほかのグループ（管理者とモデレーター以外）に入ったときに送ります。Discourse と同じく既定ではオフです。"
        subject: "%{group_name} グループに追加されました"
        body: "[%{group_name}](%{base_url}%{group_path}) グループのメンバーとして追加されました。"
      flags_agreed_and_post_deleted:
        title: "通報された投稿の削除"
        help: "通報のある投稿をスタッフが非表示または削除したときに送ります。通報拡張（flarum/flags）が必要です。"
        subject: "通報された投稿がスタッフにより削除されました"
        body: |-
          こんにちは。

          %{site_name} からの自動メッセージです。[あなたの投稿](%{base_url}%{url})が削除されたことをお知らせします。

          %{flag_reason}

          この投稿はコミュニティから通報され、スタッフが削除を決めました。

          ```
          %{flagged_post_raw_content}
          ```

          詳しくは[コミュニティガイドライン](%{guidelines_url})をご確認ください。
      silenced_by_staff:
        title: "アカウント停止"
        help: "スタッフがアカウントを停止したときに送ります。停止拡張（flarum/suspend）が必要です。"
        subject: "アカウントが停止されました"
        body: |-
          こんにちは。

          %{site_name} からの自動メッセージです。あなたのアカウントは %{suspended_till} まで停止されました。

          %{reason}

          フォーラムの閲覧は引き続きできますが、停止が終わるまで参加はできません。ご質問は[スタッフ](%{base_url}/about)までどうぞ。
      unsilenced:
        title: "停止の解除"
        help: "停止が解除されたときに送ります。停止拡張（flarum/suspend）が必要です。"
        subject: "アカウントの停止が解除されました"
        body: |-
          こんにちは。

          %{site_name} からの自動メッセージです。あなたのアカウントの停止が解除されました。

