    settings:
      group_appearance: 外観
      group_sidebar: サイドバー
      group_header: ヘッダーとショートカット
      group_home: ホームページ
      group_list: スレッド一覧
      group_topic: スレッド
      group_profile: プロフィール
      group_community: コミュニティ
      group_composer: 投稿エディターと検索
      requires_tags: Tags 拡張機能が必要ですが、無効になっています。
      requires_fof_drafts: FoF Drafts 拡張機能が必要ですが、無効になっています。
      requires_sidebar: サイドバーがオフになっています（上のサイドバーカード）。
      section_colors: 色
      colors_help: 'このテーマには独自の色はありません。Discourse の Horizon テーマがターシャリーカラーから配色を作るように、パレット全体を Flarum のプライマリーカラーから生成します。色付きの背景、選択、リンク、フォーカスリングはすべて、ライトモードでもダークモードでもこの色から派生します。'
      colors_link: 外観で色を変更
      section_font: フォント
      font_label: フォーラムのフォント
      font_help: フォーラム全体で使う書体です。Inter と Plus Jakarta Sans はテーマに同梱されており、ラテン文字に対応します。システムフォントは何もダウンロードせず、すべての文字に対応します。
      font_inter: 'Inter: テーマの既定'
      font_jakarta: Plus Jakarta Sans
      font_system: システムフォント
      font_notice: フォントを変更するとフォーラムの CSS が再コンパイルされるため、保存に数秒かかります。
      section_surfaces: 背景とカード
      tinted_background_label: プライマリーカラーで色付けした背景
      tinted_background_help: Horizon のように、コンテンツとサイドバーの背後の背景にプライマリーカラーをうっすらと乗せます。オフにすると、ニュートラルなグレーのままです。
      content_card_label: コンテンツをカードに収める
      content_card_help: 一覧、スレッド、プロフィールを背景の上の角丸カードに配置します。オフにすると、コンテンツが枠なしで領域全体に広がります。
      section_buttons: ボタン
      pill_buttons_label: ピル型ボタン
      pill_buttons_help: Horizon のように、両端が完全に丸いボタンです。オフにすると、角がわずかに丸くなります。
      section_logo: ロゴ
      show_title_with_logo_label: ロゴの横にフォーラムのタイトルを表示
      show_title_with_logo_help: 外観でロゴをアップロードしている場合、これがオンのときだけロゴの横にタイトルを表示します。ロゴがない場合、タイトルは常に表示されます。
      section_sidebar: サイドバー
      sidebar_enabled_label: サイドバーを表示
      sidebar_enabled_help: Discourse のように、ナビゲーションとタグを並べた左の列です。オフにすると、Flarum の既定のナビゲーションに戻ります。
      sidebar_open_default_label: 開いた状態で開始
      sidebar_open_default_help: ヘッダーのボタンでまだサイドバーを開閉していない人に対する表示です。その後は各訪問者の選択が優先され、ブラウザーに保存されます。
      sidebar_new_topic_label: 「スレッドの作成」ボタン
      sidebar_new_topic_help: サイドバー上部にある、新しいスレッドの投稿エディターを開くボタンです。
      sidebar_footer_label: サイドバーのフッター
      sidebar_footer_help: サイドバー下部のボタン：ライト／ダークテーマ、新規スレッド、キーボードショートカット。
      section_sidebar_tags: タグ
      sidebar_categories_label: タグセクション
      sidebar_categories_help: 色またはアイコン付きのプライマリタグと、すべてのタグへのリンクです。
      sidebar_tags_label: セカンダリタグセクション
      sidebar_tags_help: セカンダリタグと、すべてのタグへのリンクです。
      sidebar_tags_limit_label: サイドバーのセカンダリタグ数
      sidebar_tags_limit_help: 「すべてのタグ」リンクの前に表示するセカンダリタグの数（{min}〜{max}）。
      section_header_search: ヘッダーの検索
      header_search_label: ヘッダー中央の検索欄
      header_search_help: Discourse のように、ヘッダー中央に置くピル型の検索欄です。オフにすると、Flarum の既定の検索に戻ります。
      section_shortcuts: キーボードショートカット
      keyboard_shortcuts_label: キーボードショートカット
      keyboard_shortcuts_help: Discourse のショートカット：/ で検索、c で新規スレッド、r で返信、j と k で一覧を移動、g h でホームへ、= でサイドバーを開閉、? で一覧をすべて表示。入力欄で入力中は動作しません。
      section_welcome_banner: ウェルカムバナー
      welcome_banner_label: ウェルカムバナーを表示
      welcome_banner_help: Horizon のように、外観で設定したウェルカムのタイトルとメッセージを色付き背景の上のバナーに表示します。オフにすると、ページは一覧から始まります。
      welcome_banner_guests_only_label: ゲストのみ
      welcome_banner_guests_only_help: ログイン中のメンバーは一覧に直接進みます。バナーは初めての訪問者向けです。
      welcome_banner_search_label: バナー内の検索欄
      welcome_banner_search_help: バナー中央の大きな検索欄で、フォーラムの検索を開きます。
      section_category_hero: タグのヘッダー
      category_hero_label: タグの大きなヘッダー
      category_hero_help: タグページで、一覧の前にアイコン、色、名前、説明を表示するヘッダーです。
      category_hero_children_label: 子タグをカードで表示
      category_hero_children_help: ヘッダーの下に、子タグをクリックできるカードとして表示します。
      section_nav: 一覧のタブ
      nav_unread_label: 未読タブ
      nav_unread_help: まだ読んでいない返信があるスレッドです。ログイン中のメンバーにのみ表示されます。
      nav_hot_label: 注目タブ
      nav_hot_help: ここ数日に作成されたスレッドのうち、返信が最も多いものです。
      hot_days_label: 注目で数える日数
      hot_days_help: 対象とする期間（{min}〜{max} 日）。
      section_nav_categories: タグフィルター
      nav_dropdowns_label: タグのメニュー
      nav_dropdowns_help: Discourse のように、タブの左にあるメニューで、一覧をプライマリタグやセカンダリタグで絞り込みます。
      nav_categories_link_label: タグタブ
      nav_categories_link_help: すべてのタグのページへ移動するタブです。
      section_list_columns: 一覧の列
      list_header_label: 列見出し
      list_header_help: 一覧の上にある、スレッド、返信数、閲覧数、アクティビティの行です。
      list_posters_label: 参加者のアバター
      list_posters_help: Discourse の投稿者列のように、各スレッドの横に作成者と最後に返信した人のアバターを表示します。
      list_views_label: 閲覧数の列
      list_views_help: 各スレッドが閲覧された回数で、スレッドの閲覧数カードで集計されます。
      list_heat_label: 多い数値を強調
      list_heat_help: Discourse のヒートマップのように、他より大幅に多い数値をオレンジや赤で表示します。
      list_excerpts_label: 固定スレッドの抜粋
      list_excerpts_help: タイトルの下に、固定スレッドの最初の投稿の冒頭を表示します。
      list_status_icons_label: タイトル前のアイコン
      list_status_icons_help: 固定のピン、フォロー中の星など、一覧とスレッドのタイトルの横に表示される状態アイコン。
      list_status_icons_muted: '現在：Discourse のようにグレー'
      list_status_icons_colored: 'カラー：アイコンごとに色分け'
      section_categories_page: タグページ
      categories_layout_label: レイアウト
      categories_layout_help: すべてのタグのページでの表示方法です。
      categories_layout_boxes: 'ボックス: 色、説明、子タグ付きのカード'
      categories_layout_list: 'リスト: 最新スレッド付きのタグの表'
      section_topic_map: スレッドマップ
      topic_map_label: スレッドマップ
      topic_map_help: 最初の投稿の下に、作成日、最後の返信、返信数、参加者をまとめた概要を表示します。
      section_topic_timeline: タイムライン
      topic_timeline_label: 投稿の横のタイムライン
      topic_timeline_help: 右側のバーで、スレッド内の現在位置を示し、任意の投稿へ移動できます。
      section_topic_footer: スレッドのフッター
      topic_footer_label: スレッド末尾のボタン
      topic_footer_help: Discourse のように、最後の投稿の後に返信、共有、フォローを表示します。フォローには Subscriptions 拡張機能が必要です。
      topic_footer_notifications_label: "フッターのフォロー（デスクトップ）"
      topic_footer_notifications_help: "フッターボタンの下にある「ウォッチ中」ボタンと通知レベルの説明文。デスクトップではタイムラインのベルが同じ役割を果たします。スマートフォンとタブレットでは、フッターのものが唯一のため常に表示されます。"
      section_suggested: おすすめスレッド
      suggested_topics_label: おすすめスレッドを表示
      suggested_topics_help: スレッドの末尾に、続けて読む他のスレッドの短い一覧を表示します。できるだけ同じタグから選びます。
      suggested_count_label: スレッド数
      suggested_count_help: おすすめするスレッドの数（{min}〜{max}）。
      section_user_page: プロフィールページ
      user_cover_label: プロフィール上部のカバー
      user_cover_help: Discourse のように、大きなアバターと名前の背後に広い帯を表示します。
      user_stats_label: 統計
      user_stats_help: 名前の下に登録日、最終訪問、投稿数とスレッド数を表示します。いいねは Likes 拡張機能がある場合のみ表示されます。
      user_summary_label: 概要タブ
      user_summary_help: ユーザーの数値と人気のスレッド・返信を表示する最初のタブです。
      user_activity_read_label: 既読タブ
      user_activity_read_help: アクティビティに、本人が読んだスレッドを新しい順に表示します。本人と管理者だけが見られます。
      user_activity_reactions_label: リアクションタブ
      user_activity_reactions_help: アクティビティの「いいね」の代わりに、本人が付けたいいねとリアクションをひとつのリストで、絵文字と投稿の抜粋つきで表示します。リアクションは、誰がリアクションしたかを見る権限のある人にだけ表示されます。
      user_activity_votes_label: 投票タブ
      user_activity_votes_help: アクティビティに、本人が投票した投票付きの投稿を表示します。他の人には投票者を公開している投票だけが表示されます。
      user_activity_solved_label: 解決済みタブ
      user_activity_solved_help: アクティビティに、ベストアンサーに選ばれた本人の返信を表示します。
      section_user_card: ユーザーカード
      user_card_label: ユーザーカード
      user_card_help: 写真、数値、プロフィールへのリンクを載せたコンパクトなカードで、ページを離れずにアバターや名前から開けます。
      groups_aria: 設定グループ
      search_placeholder: 設定を検索…
      search_clear: 検索をクリア
      search_empty: 設定が見つかりません。
