      palette_background: 色付きの背景
      palette_selected: 選択
      palette_accent_low: 淡いアクセント
      palette_ring: フォーカスリング
      palette_link: リンク
      colors_current: 現在のプライマリーカラー
      palette_light: ライト
      palette_dark: ダーク
