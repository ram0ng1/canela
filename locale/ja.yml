      nice_post:
        name: ナイス返信
        description: 返信で 10 回いいねされた
        long_description: このバッジは、返信が 10 回いいねされると付与されます。あなたの返信はコミュニティに強い印象を与え、会話を前に進めました！
      good_post:
        name: グッド返信
        description: 返信で 25 回いいねされた
        long_description: このバッジは、返信が 25 回いいねされると付与されます。あなたの返信は格別で、誰にとっても会話をより魅力的なものにしました！
      great_post:
        name: グレート返信
        description: 返信で 50 回いいねされた
        long_description: このバッジは、返信が 50 回いいねされると付与されます。すごい！あなたの返信は刺激的で、魅力的で、面白く、洞察に富んでおり、コミュニティに愛されました。
      nice_topic:
        name: ナイススレッド
        description: スレッドで 10 回いいねされた
        long_description: このバッジは、スレッドが 10 回いいねされると付与されます。あなたはコミュニティが楽しめる興味深い会話を始めました！
      good_topic:
        name: グッドスレッド
        description: スレッドで 25 回いいねされた
        long_description: このバッジは、スレッドが 25 回いいねされると付与されます。あなたはコミュニティが集まって大いに楽しむ活気ある会話を始めました！
      great_topic:
