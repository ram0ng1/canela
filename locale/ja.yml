        long_description: このバッジは、投稿で初めて誰かの @ユーザー名 をメンションしたときに付与されます。メンションするたびにその人に通知が届くので、あなたの投稿に気づいてもらえます。@（アットマーク）を入力し始めるだけで、どのユーザーでもメンションできます。
      first_emoji:
        name: 初めての絵文字
        description: 投稿で絵文字を使った
        long_description: このバッジは、初めて投稿に絵文字を追加したときに付与されます。絵文字を使うと、喜びから悲しみ、怒り、その間のあらゆる感情を投稿で表現できます。
      first_flag:
        name: 初めての通報
        description: 投稿を通報した
        long_description: このバッジは、初めて投稿を通報したときに付与されます。通報は、ここを誰にとっても心地よい場所に保つために、みんなで協力する方法です。何らかの理由でモデレーターの対応が必要な投稿を見つけたら、ためらわずに通報してください。
      editor:
        name: 編集者
        description: 初めての投稿編集
        long_description: 'このバッジは、初めて自分の投稿を編集したときに付与されます。編集は大歓迎です。書式を整えたり、小さなミスを直したり、投稿時に書き忘れたことを追加したりできます。編集して投稿をさらに良くしましょう！'
      autobiographer:
        name: 自伝作家
        description: プロフィール情報を入力した
        long_description: このバッジは、ユーザープロフィールを入力し、プロフィール画像を選択すると付与されます。あなたがどんな人で、何に興味があるのかをコミュニティに少し知ってもらうことで、より良く、よりつながりのあるコミュニティになります。ぜひ参加してください！
      reader:
        name: 読者
        description: 返信が 100 件を超えるスレッドのすべての返信を読んだ
        long_description: このバッジは、返信が 100 件を超える長いスレッドを初めて読んだときに付与されます。会話をじっくり読むことで、スレッドの流れを追い、さまざまな視点を理解でき、より興味深い会話につながります。
      new_user_of_the_month:
        name: 今月の新人ユーザー
        description: 最初の 1 か月で際立った貢献をした
        long_description: このバッジは、投稿にいいねした人の数で測られる優れた全体的な貢献をたたえて、毎月 2 人の新規ユーザーに付与されます。
      welcome:
        name: ようこそ
        description: いいねを受け取った
        long_description: このバッジは、投稿で初めていいねを受け取ったときに付与されます。おめでとうございます。コミュニティの仲間が興味深い、素晴らしい、役に立つと感じる投稿をしました！
      anniversary:
        name: 記念日
        description: 1 年間活動し、少なくとも 1 回投稿したメンバー
        long_description: このバッジは、メンバーになって 1 年が経ち、その 1 年間に少なくとも 1 回投稿したときに付与されます。コミュニティにとどまり、貢献してくださりありがとうございます。あなたなしでは成り立ちません。
      appreciated:
        name: 感謝される人
        description: 20 件の投稿でいいねを 1 つ受け取った
        long_description: このバッジは、20 件の異なる投稿でそれぞれ少なくとも 1 つのいいねを受け取ったときに付与されます。コミュニティはここでの会話へのあなたの貢献を楽しんでいます！
      respected:
        name: 尊敬される人
        description: 100 件の投稿でいいねを 2 つ受け取った
        long_description: このバッジは、100 件の異なる投稿でそれぞれ少なくとも 2 つのいいねを受け取ったときに付与されます。コミュニティは、ここでの会話へのあなたの数多くの貢献に敬意を抱きつつあります。
      admired:
        name: 憧れの人
        description: 300 件の投稿でいいねを 5 つ受け取った
        long_description: このバッジは、300 件の異なる投稿でそれぞれ少なくとも 5 つのいいねを受け取ったときに付与されます。すごい！コミュニティは、ここでの会話へのあなたの頻繁で質の高い貢献を称賛しています。
      thank_you:
        name: ありがとう
        description: いいねされた投稿が 20 件あり、10 回いいねした
        long_description: このバッジは、いいねされた投稿が 20 件あり、お返しに 10 回以上いいねしたときに付与されます。誰かにいいねされたとき、あなたも時間を割いて他の人の投稿にいいねしています。
      gives_back:
        name: 恩返し
        description: いいねされた投稿が 100 件あり、100 回いいねした
        long_description: このバッジは、いいねされた投稿が 100 件あり、お返しに 100 回以上いいねしたときに付与されます。善意をつないでくれてありがとうございます！
      empathetic:
        name: 共感の人
        description: いいねされた投稿が 500 件あり、1000 回いいねした
        long_description: このバッジは、いいねされた投稿が 500 件あり、お返しに 1000 回以上いいねしたときに付与されます。すごい！あなたは寛大さと相互の感謝の模範です。
      out_of_love:
        name: 愛ゆえに
        description: 1 日に {max} 回いいねした
        long_description: このバッジは、1 日に {max} 回いいねしたときに付与されます。少し時間を取って気に入った投稿にいいねすることを忘れずにいると、コミュニティの仲間がこれからもさらに素晴らしいスレッドを生み出す励みになります。
      higher_love:
        name: より大きな愛
        description: 1 日に {max} 回のいいねを 5 回達成した
        long_description: このバッジは、5 日間それぞれで 1 日に {max} 回いいねしたときに付与されます。毎日時間を割いて、最高の会話を積極的に応援してくれてありがとうございます！
      crazy_in_love:
        name: 愛に夢中
        description: 1 日に {max} 回のいいねを 20 回達成した
        long_description: このバッジは、20 日間それぞれで 1 日に {max} 回いいねしたときに付与されます。すごい！あなたはコミュニティの仲間を日々励ます模範です！
      enthusiast:
