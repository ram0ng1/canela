        group_list_desc: ホームページ、タブ、列、タグ、スレッド一覧のカウンター。
        group_topic_desc: 投稿、タイムライン、スレッドマップ、フッター、閲覧機能。
        group_composer_desc: Discourse の投稿エディター、下書き、ハッシュタグ、詳細検索。
        group_people_desc: プロフィールページ、ユーザーカード、追加項目、アクティビティ。
        group_messages_desc: プライベートメッセージとリアルタイムチャット。
        group_community_desc: 概要、ガイドライン、ユーザー、グループ、バッジ、信頼レベル、招待。
        group_moderation_desc: 'スタッフ向けツール：一括操作、編集履歴、投稿者への通知。'
