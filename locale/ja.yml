      logo_colored_label: ロゴに色を付ける
      logo_colored_help: アップロードしたロゴを形だけにして、アクセントカラー（タグのページやスレッドではタグの色）で塗ります。SVG か透明背景の PNG で最もきれいに表示されます。
      loading_slider_label: 上部の読み込みバー
      loading_slider_help: Discourse のように、ページ移動時にページが届くまで画面上部に細いバーが流れます。Flarum の「読み込み中…」の通知の代わりです。
      loader:
        title: 読み込みインジケーター
        help: 何かを読み込んでいる間に表示される図柄です。一覧、投稿、プロフィール、モーダル、メニュー、ボタン、エディター、拡張機能、ページの初回読み込みで使われます。Flarum の灰色のリングをアニメーション SVG に置き換えます。
        keywords: 読み込み ローディング loading loader spinner preloader インジケーター svg アニメーション
        style_label: デザイン
        style_default: Flarum の標準
        style_avocado: Avocado
        style_orbital: オービタル
        style_ring: Discourse のリング
        style_dots: ドット
        style_bars: バー
        style_pulse: パルス
        style_custom: 独自の SVG
        custom_label: SVG コード
        custom_help: アニメーション SVG のコードを貼り付けるか、.svg ファイル（64 KB まで）をアップロードします。保存前にサーバーで整理され、スクリプト、イベント、外部リンクは削除されます。CSS と SMIL のアニメーションは残ります。
        custom_upload: SVG ファイルをアップロード
        custom_apply: SVG を適用
        custom_clear: 削除
        custom_too_big: ファイルが 64 KB を超えています。
        custom_not_svg: ファイルが SVG ではないようです。
        custom_empty: このデザインを使うには SVG を貼り付けるかアップロードしてください。それまでは Flarum のスピナーのままです。
        tint_label: インジケーターの色で塗る
        tint_help: SVG を形だけにして、下の色（ボタン内では文字色）で塗ります。オフにするとファイル本来の色のままです。
        color_label: 色
        color_help: 色を選ばない場合はテーマのアクセント色（プライマリ、タグページではタグの色）になります。ボタン内ではボタンの文字色に従います。
        color_primary: テーマの色を使う
        size_label: サイズ
        size_help: "Flarum のスピナーに対する大きさで、{min}% から {max}% まで。ボタン内では文字に合わせます。"
        preview: プレビュー
        notice: インジケーターを変更するとフォーラムの CSS が再コンパイルされます。保存には数秒かかります。
      toast_auto_close_label: 自動で閉じるトースト
      toast_auto_close_help: Discourse のトーストのように、隅に出る通知（「保存しました」「リンクをコピーしました」など）がタイマーバー付きで数秒後に消えます。オフにすると、閉じるまで表示されます。
      user_menu_label: Discourse のユーザーメニュー
      user_menu_help: ヘッダーのアバターから、通知、返信、いいね、メッセージ、ブックマーク、チャット、レビュー、プロフィールのタブを持つパネルを開きます（Flarum のベルとセッションメニューの代わり）。
      nav_sticky_label: タブを固定表示
      nav_sticky_help: Horizon のように、一覧をスクロール中もタブバーがヘッダーの下に固定されます。meta.discourse.org では固定されません。
      list_infinite_scroll_label: 無限スクロール
      list_infinite_scroll_help: Discourse のように、一覧の終わりが画面に近づくと次のページが自動で読み込まれます。オフにすると、Flarum の「さらに読み込む」ボタンが残ります。
      post_actions_label: Discourse の投稿アクション
      post_actions_help: Discourse のように、各投稿のバーにいいね、リンクのコピー、ブックマーク、返信と、残りを展開する「…」を表示します。オフにすると、Flarum の操作メニューに戻ります。
      embedded_replies_label: 埋め込み返信
      embedded_replies_help: Discourse のように、各投稿の「N 件の返信」でその直下に返信を開き、引用元の投稿を上に表示します。
      post_style_label: 投稿のスタイル
      post_style_help: 'タイムライン付きでは、投稿は Discourse と同じままで、avocado テーマのような縦線が投稿のアバター同士をつなぎ、イベントの通知を通り、時間の間隔（「1 か月後」）を円で示します。タブレット以上の幅で有効で、スマートフォンでは投稿は変わりません。'
      post_style_discourse: Discourse（標準）
      post_style_direct: タイムライン付き（avocado スタイル）
      topic_reply_to_style_label: 投稿の「返信先」
      topic_reply_to_style_help: 'ほかの投稿への返信で、返信先をどう表示するかです。Discourse ではヘッダーの右に「↩ 名前」（返信先が直前の投稿でないときだけ）。avocado では名前の下に「↳ 返信先 [アバター] 名前」の行をすべての返信に表示します。クリックすると返信先の投稿を表示します。'
      topic_reply_to_style_discourse: 'Discourse（標準: ヘッダーの右に ↩ 名前）'
      topic_reply_to_style_avocado: 名前の下の行（avocado スタイル）
      new_replies_bar_label: 新着返信のお知らせ
      new_replies_bar_help: Discourse のように、スレッドを読んでいる途中でリアルタイムに返信が届くと「N 件の新しい返信があります」のバーが表示され、そこへ移動できます。
      content_width_label: 'コンテンツの幅'
      content_width_default: 'デフォルト'
      content_width_wide: '広い'
      content_width_wider: 'さらに広い'
      content_width_90: '90%'
      content_width_full: '全幅'
      content_width_custom: 'カスタム'
      content_width_reset: 'デフォルト'
      content_width_help: 'コンテンツカード（一覧、スレッド、プロフィール）の最大幅です。スレッドでは投稿の列も一緒に広がります。デフォルトは Discourse と同じ 1110px で、90% と全幅は画面に合わせます。プレビューは 1440px の画面で実際のフォーラムを表示します。'
