      forum_background_label: "Fundo do fórum"
      forum_background_help: "O que fica atrás do conteúdo e da barra lateral. O degradê tingido (com ou sem os ícones desfocados) e a cor tingida puxam a cor primária; o liso fica num cinza neutro."
      auth_pages_modals_label: "Todos os links levam às páginas"
      auth_pages_modals_help: "Responder, curtir, seguir e qualquer outro botão que pede login também abrem as páginas de entrar e cadastrar, e não os modais. Desligada, só os botões do cabeçalho levam às páginas."
      content_card_label: Conteúdo dentro de um cartão
      content_card_help: A lista, a discussão e o perfil ficam num cartão de cantos arredondados sobre o fundo. Desligado, o conteúdo ocupa a área toda, sem moldura.
      section_buttons: Botões
      pill_buttons_label: Botões em pílula
      pill_buttons_help: Botões com as pontas totalmente arredondadas. Desligado, ficam com cantos levemente arredondados.
      section_logo: Logo
      show_title_with_logo_label: Mostrar o título do fórum ao lado do logo
      show_title_with_logo_help: Com um logo enviado em Aparência, o título só aparece ao lado dele com esta opção ligada. Sem logo, o título aparece sempre.
      section_sidebar: Barra lateral
      sidebar_enabled_label: Mostrar a barra lateral
      sidebar_enabled_help: A coluna à esquerda com a navegação e as tags. Desligada, o fórum volta à navegação padrão do Flarum.
      sidebar_open_default_label: Começar aberta
      sidebar_open_default_help: Como a barra aparece para quem ainda não a abriu nem fechou pelo botão do cabeçalho. Depois disso vale a escolha de cada visitante, guardada no navegador.
      sidebar_new_topic_label: Botão "Iniciar Discussão"
      sidebar_new_topic_help: O botão no topo da barra que abre o editor de uma nova discussão.
      sidebar_footer_label: Rodapé da barra
      sidebar_footer_help: 'Os botões no fim da barra: tema claro ou escuro, nova discussão e atalhos de teclado.'
      section_sidebar_tags: Tags
      sidebar_categories_label: Seção Tags
      sidebar_categories_help: As tags primárias, cada uma com a sua cor ou ícone, e o link para todas as tags.
      sidebar_tags_label: Seção Tags secundárias
      sidebar_tags_help: As tags secundárias, com o link para todas as tags.
      sidebar_tags_limit_label: Tags secundárias na barra
      sidebar_tags_limit_help: Quantas tags secundárias listar antes do link "Todas as tags", de {min} a {max}.
      section_header_search: Busca no cabeçalho
      header_search_label: Campo de busca no centro do cabeçalho
      header_search_help: A pílula de busca no meio do cabeçalho. Desligada, o cabeçalho volta à busca padrão do Flarum.
      section_shortcuts: Atalhos de teclado
      keyboard_shortcuts_label: Atalhos de teclado
      keyboard_shortcuts_help: 'Atalhos de teclado: / busca, c nova discussão, r responder, j e k percorrem a lista, g h volta ao início, = abre ou fecha a barra lateral e ? mostra a lista completa. Não valem enquanto se digita num campo.'
      section_welcome_banner: Banner de boas-vindas
      welcome_banner_label: Mostrar o banner de boas-vindas
      welcome_banner_help: O título e a mensagem de boas-vindas de Aparência num banner sobre o fundo tingido. Desligado, a página começa direto na lista.
      welcome_banner_guests_only_label: Só para visitantes
      welcome_banner_guests_only_help: Quem já entrou na conta vai direto para a lista; o banner fica para quem chega pela primeira vez.
      welcome_banner_search_label: Campo de busca no banner
      welcome_banner_search_help: Uma busca grande no meio do banner, que abre a busca do fórum.
      section_category_hero: Topo da tag
      category_hero_label: Cabeçalho grande nas tags
      category_hero_help: Na página de uma tag, um topo com o ícone, a cor, o nome e a descrição dela, antes da lista.
      category_hero_children_label: Tags filhas em cartões
      category_hero_children_help: Abaixo do topo, as tags filhas aparecem como cartões clicáveis.
      section_nav: Abas da lista
      nav_unread_label: Aba Não lidas
      nav_unread_help: As discussões com respostas que a pessoa ainda não leu. Só aparece para quem entrou na conta.
      nav_hot_label: Aba Em alta
      nav_hot_help: As discussões com mais respostas entre as abertas nos últimos dias.
      hot_days_label: Dias contados em Em alta
      hot_days_help: O período considerado, de {min} a {max} dias.
      section_nav_categories: Filtros por tag
      nav_dropdowns_label: Menus de tags
      nav_dropdowns_help: Os menus à esquerda das abas, para filtrar a lista por tag primária e por tag secundária.
      nav_categories_link_label: Aba Tags
      nav_categories_link_help: Uma aba que leva à página com todas as tags.
      section_list_columns: Colunas da lista
      list_header_label: Cabeçalho das colunas
      list_header_help: A linha com Discussão, Respostas, Visualizações e Atividade acima da lista.
      list_posters_label: Avatares de quem participou
      list_posters_help: Os avatares do autor e de quem respondeu por último ao lado de cada discussão, numa coluna de participantes.
      list_views_label: Coluna de visualizações
      list_views_help: O número de visualizações de cada discussão, contado pelo card Visualizações de discussão.
      list_heat_label: Destacar contagens altas
      list_heat_help: Pinta as contagens em laranja ou vermelho quando estão bem acima das demais, como um mapa de calor.
      list_excerpts_label: Resumo das discussões fixadas
      list_excerpts_help: Abaixo do título, o começo da primeira postagem das discussões fixadas.
      list_status_icons_label: Ícones antes do título
      list_status_icons_help: O alfinete de fixada, a estrela de acompanhando e os demais ícones de situação ao lado do título, na lista e na discussão.
