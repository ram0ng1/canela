        post_read_state_label: "Marcas de leitura"
        post_read_state_help: "O pontinho de \"postagem não lida\" no canto de cada postagem nova, que some ao ler, e a linha vermelha \"último acesso\" depois da última postagem lida na visita anterior."
        post_shortcuts_label: "Atalhos das postagens"
        post_shortcuts_help: "j/k andam pelas postagens e l, b, s, e, r, q, d, ! agem sobre a selecionada; # pula para uma postagem; Home/End, shift+L, shift+R, shift+S, shift+P, f, m w/m r/m m e as sequências g n, g u, g b, g m, g d, g j, g k. A janela \"?\" lista todos."
        notify_post_edited_label: "Notificar quando editarem sua postagem"
        notify_post_edited_help: "\"Fulano editou sua postagem\" para o autor, quando outra pessoa (a moderação, por exemplo) muda o texto."
        notify_topic_linked_label: "Notificar quando vincularem sua discussão"
        notify_topic_linked_help: "\"Fulano vinculou sua discussão\" quando uma postagem traz um link para uma discussão sua."
        list_last_visit_label: "Linha \"último acesso\""
        list_last_visit_help: "Na lista de Recentes, uma linha vermelha separa as discussões que mudaram desde a visita anterior das que já estavam assim. A visita anterior fica guardada no aparelho do leitor."
        list_dismiss_label: "Botão \"Descartar\""
        list_dismiss_help: "Nas listas Não lidos e Novos, o botão que marca como lidas as discussões da lista (em cima, à direita, e no fim da lista)."
        share_networks_label: "Redes"
        share_networks_help: "Separadas por vírgula, na ordem em que aparecem: x, facebook, linkedin, whatsapp, telegram, reddit, email."
        sidebar_home_url_label: "Endereço do Início"
        sidebar_home_url_help: "Um endereço do fórum (/p/boas-vindas) ou de outro site."
        sidebar_faq_url_label: "FAQ / Diretrizes"
        sidebar_faq_url_help: "Endereço da página de perguntas frequentes ou das diretrizes da comunidade."
        sidebar_tos_url_label: "Termos de serviço"
        sidebar_tos_url_help: "Endereço dos termos de serviço."
        sidebar_privacy_url_label: "Privacidade"
        sidebar_privacy_url_help: "Endereço da política de privacidade."
        sidebar_custom_title_label: "Título da seção personalizada"
        sidebar_custom_title_help: "O nome da seção de links (padrão: \"Links\")."
        sidebar_custom_links_label: "Links da seção personalizada"
        sidebar_custom_links_help: "Um link por linha: Rótulo | endereço | ícone (opcional, do Font Awesome). Endereços que começam com / são do próprio fórum. Sem links, a seção não aparece."
        inline_title_editor_help: "Quem pode renomear vê um lápis ao lado do título da discussão: o título vira um campo, com o botão de tags e ✓/✕ para salvar ou desistir."
        share_modal_help: "O botão Compartilhar abre uma janela com o link, o botão de copiar e os botões das redes. Desligado, ele só copia o link. No celular vale a folha de compartilhamento do sistema."
        local_dates_help: "[date=2026-10-20 time=14:00 timezone=\"America/Sao_Paulo\"] mostra a data e a hora no fuso de quem lê. Vale depois de limpar o cache."
        invites_enabled_help: "Quem tem a permissão \"Convidar\" (Permissões) gera links com validade e número de usos, em Compartilhar e no menu \"Mais\". Quem entra por um link aparece como convidado e quem convidou recebe \"Fulano aceitou seu convite\". Precisa do cadastro aberto."
        not_found_page_help: "\"Oops! Essa página não existe ou é privada.\", com \"Voltar para o início\" e a busca, no lugar da página de erro simples. O modelo escolhido abaixo define o desenho e quais discussões aparecem."
        sidebar_home_link_help: "O primeiro link da barra lateral. Quando ele leva à lista de discussões, \"Todas as Discussões\" passa a abrir a lista de Recentes, para os dois não ficarem marcados juntos."
        backend_off: "O backend destes recursos (extend/gaps.php) ainda não está carregado no servidor."
        cooked_title: "Conteúdo das postagens"
        tables_notice: "Tabelas em markdown (| a | b |): ligue o PipeTables no FoF Formatting."
        reading_title: "Leitura e navegação na discussão"
        inline_title_editor_label: "Editar o título no cabeçalho"
        share_modal_label: "Janela \"Compartilhar discussão\""
        local_dates_label: "Datas locais"
        invites_enabled_label: "Links de convite"
        invites_expire_days_label: "Validade padrão (dias)"
        invites_expire_days_help: "De 1 a 90 dias."
        not_found_page_label: "Página 404"
        list_title: "Último acesso e Descartar"
        sidebar_home_link_label: "Link \"Início\""
        sidebar_home_label: "Página de destino"
        sidebar_home_index: "Lista de discussões (página inicial)"
        sidebar_home_categories: "Tags"
        sidebar_home_url_option: "Outro endereço"
        sidebar_title: "Links extras"
        sidebar_help: "Os links de FAQ, termos e privacidade entram no menu \"Mais\" quando têm endereço. \"Revisar\" aparece sozinho para a moderação, com a fila de sinalizações."
        notifications_title: Avisos ao autor
        mention_cards_help: Clicar numa menção @fulano abre o cartão de usuário em vez de ir ao perfil.
      integrations:
        messages_label: Mensagens privadas aprimoradas
        messages_help: 'Sobre o flarum/messages: as caixas do perfil (Últimos, Enviadas, Novo, Não lidos, Arquivo), o arquivo por pessoa, o título da mensagem, as reações e o "sair da mensagem".'
        solved_label: Solução aceita
        solved_help: O "✓ Solução" na barra da postagem e a resposta aceita logo abaixo do primeiro post.
        reactions_label: Reações
        reactions_help: O resumo dos emoji na barra da postagem.
        polls_label: Enquetes
        polls_help: 'As enquetes em grade: as barras de resultado e a contagem grande de votos ao lado.'
        links_sidebar_label: Links na barra lateral
        links_sidebar_help: Os links do FoF Links saem do cabeçalho e vão para uma seção da barra lateral.
        upload_progress_label: Progresso do envio
        upload_progress_help: A barra "Enviando…" no editor enquanto um arquivo do FoF Upload sobe.
        profile_cover_label: Capa do perfil (forumaker/profile-cover)
        profile_cover_help: 'A capa da extensão no lugar da capa interna do tema: na faixa do perfil, no fundo do cartão do usuário (na miniatura, quando existe) e na posição escolhida no editor dela, que abre pelo menu "…" do perfil e pelas Configurações. As imagens internas ficam guardadas e voltam se esta chave for desligada.'
        thumbnails_label: Miniaturas na lista
        widgets_label: 'Widgets (fof/forum-widgets-core)'
        widgets_help: "Os widgets da extensão em cartões, como os do tema, numa coluna à direita da lista. Os que ficariam na barra lateral da página (que o tema esconde) entram na mesma coluna. Desligado, ficam com o visual e os lugares da extensão."
        widgets_width_label: 'Largura da coluna'
        widgets_width_help: "A largura da coluna de widgets ao lado da lista, no computador (de 200 a 480 px). A lista fica com o resto do espaço."
        thumbnails_help: A miniatura do FoF Discussion Thumbnail ao lado do título na lista de discussões.
        verified_label: Selo de verificado
        verified_help: 'O selo do ramon/verified logo depois do nome, na linha do texto e do tamanho dele, como um ícone de usuário: no cabeçalho do post, nos posts embutidos, no "em resposta a", no cartão e no perfil.'
        wiki_label: 'Wiki no padrão do tema'
        wiki_help: 'A wiki da linkrobins/wiki com a cara do tema: o índice como a lista de discussões, o artigo como o primeiro post (com o mapa e o histórico), o composer de discussão para escrever (com rascunho, opções avançadas e perguntas frequentes) e o link "Wiki" na seção da comunidade da barra lateral.'
        ramon_chat_label: Chat (ramon/chat) no visual do tema
        ramon_chat_help: 'O chat da extensão ramon/chat com a cara do chat do tema: a página sem a segunda coluna, a gaveta, as mensagens, o editor, os fios e as telas de canais. Com ela ligada, o chat do tema dá lugar ao da extensão.'
        ramon_chat_sidebar_label: Canais na barra lateral
        ramon_chat_sidebar_help: As seções "Canais" e "Mensagens diretas" (com "Meus fios", "Pesquisar" e "Salvos") na barra lateral do tema; a página do chat perde a coluna de canais dela.
        ramon_chat_notifications_label: 'Aba "Chat" no menu do usuário'
        ramon_chat_notifications_help: As notificações do chat (convites, menções, moderação) numa aba própria do menu do usuário.
        ramon_chat_user_button_label: 'Botão "Chat" no cartão e no perfil'
        ramon_chat_user_button_help: 'Abrir a conversa direta pelo botão "Chat" no cartão e no perfil, em vez do item no menu "…". Sem efeito com o flarum/messages ligado: aí a conversa privada é a "Mensagem" dele.'
        marketplace_label: Loja (ramon/marketplace) no visual do tema
        marketplace_help: 'As páginas da loja (vitrine, produto, carrinho, checkout, pedidos, downloads, painel do vendedor, cursos e planos) no cartão do tema, com o título como os heros, os botões, campos, abas e modais do tema, as cores derivadas da cor primária e os ícones Lucide.'
        marketplace_sidebar_label: 'Seção "Loja" na barra lateral'
        marketplace_sidebar_help: 'Os links da loja (Marketplace, Carrinho, Pedidos, Downloads, Lista de desejos…) numa seção recolhível da barra lateral, no lugar do menu que abria ao passar o mouse em "Loja".'
      group_ai: IA
      ai:
        translation_enabled_label: Tradução automática
        translation_enabled_help: Postagens e títulos escritos num idioma diferente do de quem lê são traduzidos pela IA na primeira leitura e guardados para todos. O 文A ao lado da data alterna entre a tradução e o original. Cada postagem traduzida é uma chamada ao modelo rápido.
        translation_locales_label: Idiomas para os quais traduzir
        translation_locales_help: O idioma de quem lê é o escolhido nas preferências (ou o do fórum, para visitantes). Quem lê num idioma desmarcado vê sempre o original.
        translation_titles_label: Traduzir os títulos
        translation_titles_help: Os títulos das discussões também, na lista e na discussão, numa chamada só para a página toda.
        translation_public_only_label: Só conteúdo público
        translation_public_only_help: Traduz só o que um visitante também veria. Desligado, as tags restritas também passam pelo modelo (nunca as mensagens privadas nem as postagens ocultas).
        translation_daily_limit_label: Chamadas por dia (fórum todo)
        translation_daily_limit_help: Cada postagem traduzida, cada lote de títulos e cada lote de detecção de idioma conta uma. Esgotado, o fórum mostra o original até o dia seguinte. 0 = sem limite.
        requires_provider: Configure o provedor e a chave no card "Provedor e modelos" antes.
        key_saved: •••••••• (chave gravada; digite para trocar)
        key_clear: Apagar a chave gravada
        test_button: Testar conexão
        persona_off: desligada
        persona_name: Nome
        persona_id: Identificador (letras, números, _ e -)
        persona_description: Descrição (aparece no seletor)
        persona_prompt: Prompt de sistema
        persona_enabled: Ligada
        persona_search: Pode buscar no fórum
        persona_read: Pode ler discussões
        persona_web: Pode pesquisar na web (só Anthropic; cobrado por busca)
        persona_remove: Remover persona
        persona_add: Nova persona
        persona_restore: Restaurar as padrões
        default_persona_label: Persona padrão
        default_persona_help: A que vem escolhida na "Nova pergunta" e no "Perguntar à IA" da busca.
        persona_new_name: Nova persona
        schema_missing: 'As tabelas da IA ainda não foram criadas: rode "php flarum migrate". Até lá os recursos ficam escondidos.'
        not_configured: Sem chave de API configurada, os recursos de IA ficam escondidos no fórum. Configure o provedor abaixo e use "Testar conexão".
        provider_title: Provedor e modelos
        provider_label: Provedor
        provider_help: A Anthropic (Claude) é o padrão. "Compatível com OpenAI" serve para a OpenAI e para qualquer serviço com a mesma API (OpenRouter, Groq, Mistral, DeepSeek, Ollama, LM Studio…).
        provider_anthropic: Anthropic (Claude)
        provider_openai: Compatível com OpenAI
        anthropic_key_label: Chave da API da Anthropic
        anthropic_key_help: Crie em console.anthropic.com → API Keys. Fica só no servidor; o fórum nunca a recebe.
        model_label: Modelo principal
        anthropic_model_help: Usado no bot, nos resumos e nos modos do ajudante que reescrevem (explicar, prompt personalizado). O Sonnet equilibra qualidade e custo; o Opus é o mais capaz.
        fast_model_label: Modelo rápido
        fast_model_help: 'Para as tarefas curtas: títulos das conversas, revisão, tradução, sugestão de título e de tags, resumos curtos da lista.'
        openai_url_label: URL base da API
        openai_url_help: 'O endereço até o /v1; o tema acrescenta /chat/completions. Ex.: https://api.openai.com/v1, https://openrouter.ai/api/v1, http://localhost:11434/v1.'
        openai_key_label: Chave da API
        openai_key_help: 'Enviada como "Authorization: Bearer". Um servidor local pode dispensar a chave.'
        openai_fast_help: Vazio usa o principal.
        features_title: Recursos
        summary_min_posts_label: Mínimo de postagens para resumir
        summary_min_posts_help: Discussões menores não mostram o botão.
        personas_title: Personas
        personas_help: Cada persona tem nome, descrição, o prompt de sistema e as ferramentas que pode usar. Quem conversa escolhe a persona embaixo do campo de pergunta.
        access_title: Acesso e limites
        use_permission: 'Usar o bot de IA, o ajudante do editor e o "Perguntar à IA"'
        summarize_permission: 'Gerar resumos de discussões com IA'
        access_permissions_help: 'Quem usa o bot, o ajudante e o "Perguntar à IA", e quem gera resumos de discussões, se escolhe em Administração → Permissões. Ler um resumo pronto, qualquer um que veja a discussão pode, inclusive visitantes. Administradores sempre podem.'
        daily_limit_label: Pedidos por pessoa por dia
        daily_limit_help: Cada pergunta ao bot, cada uso do ajudante e cada resumo gerado conta um. 0 = sem limite. Administradores não têm limite.
        embeddings_title: Embeddings
        requires_related: Ligue "Discussões relacionadas" no card Recursos.
        embeddings_help: 'A Anthropic não tem API de embeddings: use uma compatível com a da OpenAI (OpenAI, Voyage, Mistral, Ollama…). Para gerar todos de uma vez: "php flarum canela:ai-embeddings --all".'
        embeddings_url_label: URL da API de embeddings
        embeddings_key_label: Chave da API
        embeddings_model_label: Modelo
        enabled_label: Ligar a IA
        enabled_help: Desligada, nenhum recurso de IA aparece no fórum e a API da IA responde 404.
        bot_enabled_label: Bot de IA (conversas)
        bot_enabled_help: 'A página /ai/conversations: perguntas à IA, com a lista de conversas na barra lateral, personas e respostas em streaming. Com as personas que podem, a IA busca e lê o fórum (só o que a pessoa pode ver) e cita as discussões.'
        bot_header_icon_label: Ícone do robô no cabeçalho
        bot_header_icon_help: Abre as conversas; dentro delas, volta para onde a pessoa estava.
        bot_sidebar_link_label: Link "Bot de IA" na barra lateral
        bot_sidebar_link_help: Na seção da comunidade.
        search_enabled_label: Perguntar à IA na busca
        search_enabled_help: 'O campo de busca vira "Pesquisar ou perguntar à IA", e o modal de busca oferece "Perguntar à IA: <consulta>", que abre a conversa.'
        helper_enabled_label: Ajudante de IA no editor
        helper_enabled_help: 'O botão ✨ da barra do editor: revisar, traduzir, simplificar, explicar, gerar tabela, prompt personalizado, sugerir título e sugerir tags, com a prévia das mudanças e "Confirmar/Descartar".'
        summary_enabled_label: Resumo da discussão
        summary_enabled_help: O botão "Resumir" no mapa da discussão abre o painel com o resumo em streaming. O resumo fica guardado, e todos que veem a discussão podem lê-lo; quando a discussão ganha respostas, ele aparece como desatualizado, com "Gerar novamente".
        gists_enabled_label: Resumos curtos na lista
        gists_enabled_help: Uma frase gerada pela IA no lugar do excerto, nas discussões mais ativas. Gerados de hora em hora pelo agendador ("php flarum schedule:run" no cron), até 20 por rodada, cada um é uma chamada ao modelo rápido.
        related_enabled_label: Discussões relacionadas (embeddings)
        related_enabled_help: No fim da discussão, as discussões mais parecidas no significado. Precisa da API de embeddings (configurada aqui, com o recurso ligado); os vetores são gerados de hora em hora e na primeira visita a cada discussão.
      auth:
        pages_label: Entrar e cadastrar em página própria
        pages_help: Os botões Entrar e Cadastrar-se do cabeçalho levam às páginas /login e /signup. Desligada, eles abrem os modais.
        layout_card_title: "Leiaute e fundo"
        layout_card_help: "Como as páginas de entrar e de cadastro se organizam na tela e o que fica atrás do formulário."
        texts_card_title: "Textos"
        texts_card_help: "O título e o subtítulo de cada página. Vazio, fica o texto padrão do tema."
        layout_label: "Leiaute"
        layout_help: "Em todos, a página fica sem o cabeçalho, só com o logo do fórum. Com login social, os botões vêm antes do formulário (no lado a lado, ao lado dele)."
        layout_card: "Cartão único sobre o fundo (padrão)"
        layout_discourse: "Lado a lado: sem cartão, login social ao lado"
        layout_split: "Tela dividida: painel colorido à esquerda"
        background_label: "Fundo das páginas de entrar e cadastrar"
        background_help: "Na tela dividida, a imagem vai para o painel da esquerda; os outros fundos ficam atrás do formulário."
        text_default: "Vazio: o texto padrão"
        texts_login: "Textos da página de entrar"
        texts_signup: "Textos da página de cadastro"
        texts_panel: "Painel da tela dividida"
        title_label: "Título"
        subtitle_label: "Subtítulo (opcional)"
        panel_login_title: "Título no login"
        panel_signup_title: "Título no cadastro"
        panel_login_text: "Texto no login"
        panel_signup_text: "Texto no cadastro"
      events:
        title: Eventos
        backend_off: O backend dos eventos (extend/events.php) ainda não está carregado no servidor.
        events_enabled_help: 'O "Criar evento" no menu ⊕ do composer põe um evento no primeiro post: data, hora e fuso, recorrência, endereço da transmissão, local e limite de vagas. O post mostra o cartão com "Eu vou", "Interessado" e "Não vou", os participantes e o "Adicionar à agenda" (Google e .ics). Desligado, o cartão vira texto e a API responde como se o recurso não existisse.'
        events_tag_label: Tag dos eventos
        events_tag_any: Qualquer tag
        events_tag_help: 'O botão "Criar evento" só aparece ao criar uma discussão nesta tag, e só as discussões dela mostram o cartão do evento, entram em "Próximos eventos" e mandam lembrete. Quem pode criar evento é quem pode começar discussão na tag (as permissões da própria tag). Em "Qualquer tag", vale em todas as discussões.'
        events_list_badge_label: Data na lista e no cabeçalho
        events_list_badge_help: 'A data do evento ("em 3 dias", "há 2 dias") ao lado do título na lista de discussões e no cabeçalho do tópico.'
        events_upcoming_label: Próximos eventos
        events_upcoming_help: 'O link "Eventos" na barra lateral, a página /events (lista e calendário) e, no topo da lista da tag dos eventos, as próximas datas.'
        events_chat_label: Chat do evento
        events_chat_help: 'O construtor ganha a opção "Chat do evento": um canal do ramon/chat só para o evento, preso à tag da discussão; quem marca "Eu vou" entra no canal.'
        events_docked_chat_label: Chat ao lado do tópico
        events_docked_chat_help: No computador, o canal do evento fica numa coluna à direita do tópico, da altura da tela. No celular e no tablet, o cartão tem o link para o chat.
        events_reminder_minutes_label: Lembrete antes do evento
        events_reminder_minutes_help: 'Quantos minutos antes de cada ocorrência quem marcou "Eu vou" recebe o alerta. Zero desliga o lembrete.'
        minutes: min
        reminders_notice: 'Os lembretes saem pelo agendador do Flarum, a cada cinco minutos: o servidor precisa rodar "php flarum schedule:run" pelo cron a cada minuto.'
      cooked:
        backend_off: A sintaxe das notas e do sumário (extend/cooked.php) ainda não está carregada no servidor.
        footnotes_title: Notas de rodapé
        footnotes_help: 'Notas de rodapé: "texto[^1]" com "[^1]: a nota" no fim do post, ou a nota em linha "^[a nota]". O número aparece pequeno, acima da linha, e o clique abre a nota numa dica. O menu ⊕ do composer ganha "Nota de rodapé". Desligado, as notas ficam como "[1]" e "[1]: texto".'
        toc_title: Sumário
        toc_help: 'Com [toc] no primeiro post (o menu ⊕ do composer tem "Inserir sumário"), os títulos dele aparecem na coluna da linha do tempo, com o título em que se está marcado e "Ir para o fim". O botão embaixo troca entre "Conteúdo" e "Linha de tempo", e a escolha fica no navegador. No celular, o sumário fica na folha da linha do tempo.'
        toc_min_headings_label: Mínimo de títulos
        toc_min_headings_help: Com menos títulos que isso no primeiro post, o sumário não aparece.
        toc_auto_tags_label: Sumário automático nestas tags
        toc_auto_tags_help: Nas discussões destas tags, o primeiro post ganha o sumário mesmo sem o [toc] (desde que tenha títulos suficientes).
      bookmarks:
        title: Marcadores
        bookmarks_enabled_label: Marcadores
        bookmarks_enabled_help: Cada usuário marca posts para voltar depois, com um nome e um lembrete opcionais, e encontra todos na aba "Marcadores" do próprio perfil. Desligado, os botões somem e a API responde como se o recurso não existisse, os marcadores já criados ficam guardados.
        bookmarks_topic_button_label: Marcar discussão
        bookmarks_topic_button_help: Acrescenta "Marcar discussão" aos controles da discussão (o menu "…" do rodapé). Marca o primeiro post.
        bookmarks_user_menu_label: Item no menu do usuário
        bookmarks_user_menu_help: Um atalho "Marcadores" no menu do avatar, logo abaixo de "Perfil".
        reminders_notice: Os lembretes saem pelo agendador do Flarum, a cada cinco minutos, o servidor precisa rodar "php flarum schedule:run" pelo cron a cada minuto. Sem o cron, os marcadores funcionam, mas nenhum lembrete é enviado.
      composer:
        section_editor: Editor do tema
        enabled_label: Recursos do editor do tema
        enabled_help: 'A chave geral: desligada, o composer volta a ser o do Flarum, sem nenhum dos recursos abaixo.'
        emoji_label: Seletor de emoji
        emoji_help: O botão de emoji da barra abre o seletor com busca, categorias, usados recentemente e tom de pele. Com a extensão Emoji, os emoji aparecem como as imagens dela.
        emoji_notice: 'A extensão Emoji está desligada: o seletor usa os emoji do sistema e o tema oferece o autocompletar ":nome".'
        preview_label: Pré-visualização lado a lado
        preview_help: No computador, o texto formatado aparece à direita do editor. Cada pessoa pode escondê-la pelo botão « no canto do editor.
        similar_label: Discussões semelhantes
        similar_help: Ao escrever o título de uma discussão nova (três palavras ou mais), mostra "Sua discussão é semelhante a…" com até cinco discussões parecidas.
        linked_topic_label: Responder como discussão vinculada
        linked_topic_help: No composer de resposta, o menu "↩ ▾" troca a resposta por uma discussão nova com o mesmo texto, um link de volta e as mesmas tags.
        section_drafts: Rascunhos
        drafts_label: Rascunhos (fof/drafts)
        drafts_help: 'Com a extensão FoF Drafts, o tema cuida dos rascunhos assim: a discussão nova e a resposta são salvas sozinhas dois segundos depois de parar de escrever, responder numa discussão retoma o rascunho dela, fechar com texto pergunta se descarta ou guarda, e o botão Iniciar Discussão ganha o ⌄ com a lista. Também ficam no menu do usuário e na aba Rascunhos do perfil.'
        drafts_note: Os rascunhos são guardados pelo fof/drafts (tabela drafts), que também cuida das permissões e do agendamento. Edições de postagens não têm rascunho.
        section_hashtags: '#tag'
        hashtags_label: Hashtags de tags
        hashtags_help: 'Digitar # no editor sugere as tags e insere um link para elas; nos posts, esses links (e as menções de tag da extensão Menções) viram a pílula com o símbolo da tag.'
        hashtags_mentions_notice: 'Com a extensão Menções ligada, o # do editor é dela (menção de tag); o tema só desenha as menções como hashtags.'
        requires_composer: Os recursos do editor estão desligados (card Editor do tema, acima).
      extras:
        search_title: Página de busca
        search_page_enabled_label: Página de busca avançada
        search_page_enabled_help: 'A página /search: abas de discussões, postagens, tags e usuários, filtros avançados (autor, tag primária, tags, só no título, curtidos, status, datas, mínimo de postagens) e ordenação. O modal de busca ganha o link “Busca avançada”.'
        search_notice: 'Os filtros também viram atalhos que se digitam na busca: em:título, em:curtidos, em:marcadores e mín-postagens:5, ao lado dos do Flarum (autor:, tag:, é:trancada…).'
        bulk_title: Seleção em massa
        bulk_select_enabled_label: Seleção em massa para a moderação
        bulk_select_enabled_help: 'Um botão na barra da lista liga caixas de seleção em cada discussão e uma barra de ações: marcar como lida, fixar, trancar, alterar tags, ocultar e excluir. Só aparece para quem pode moderar alguma discussão da lista, e cada ação só vale onde a pessoa tem permissão.'
        top_periods_title: Melhores por período
        top_periods_enabled_label: Seletor de período na aba Melhores
        top_periods_enabled_help: Na aba Melhores aparece “Todo o período / Ano / Trimestre / Mês / Semana / Hoje”, que limita a lista às discussões criadas no intervalo.
        text_size_title: Tamanho do texto
        text_size_enabled_label: Escolha do tamanho do texto
        text_size_enabled_help: Em Configurações, cada pessoa escolhe Menor, Normal, Maior ou Máximo. A escolha vale para o aparelho (fica no navegador).
        banner_title: Banner de anúncio
        banner_enabled_label: Mostrar o banner
        banner_enabled_help: Uma faixa acima do conteúdo, em todas as páginas, com um botão de fechar. Quem fecha não vê de novo, até o texto mudar.
        banner_text_label: Texto do banner
        banner_text_help: Markdown, BBCode e emoji, como numa postagem. Para HTML, comece o texto com uma tag HTML (p, div…). Vazio, o banner não aparece.
        banner_reshow: Mostrar de novo para quem fechou
        banner_reshow_done: O banner vai aparecer de novo para todos.
        print_title: Imprimir discussão
        print_topic_enabled_label: Item “Imprimir” nos controles da discussão
        print_topic_enabled_help: Carrega todas as postagens numa visão limpa (sem barra lateral, cabeçalho nem linha do tempo) e abre a impressão do navegador, que também salva em PDF.
        history_title: Histórico de edições
        post_history_enabled_label: Guardar e mostrar o histórico de edições
        post_history_enabled_help: Cada edição guarda o texto anterior. O “Editado” do post vira um lápis com o número de revisões, que abre a comparação entre as versões (no texto ou lado a lado).
        history_notice: Só as edições feitas com o recurso ligado entram no histórico. Desligado, nada novo é guardado e o histórico some do fórum, o que já foi guardado fica no banco. O texto das versões de um post oculto só aparece para quem pode editá-lo.
        post_history_public_label: Histórico visível para todos
        post_history_public_help: Desligado, só o autor do post e quem pode editá-lo abrem o histórico; os demais veem o “Editado” do Flarum.
      section_icons: Ícones
      lucide_icons_label: Ícones Lucide
      lucide_icons_help: Os ícones de interface (busca, sino, responder, curtir, menus…) com o traço fino do Lucide. Desligado, voltam os ícones sólidos do Font Awesome. Os que não têm substituto no Lucide (marcas e parte dos escolhidos para tags e grupos) continuam no Font Awesome.
      metoo:
        title: Eu também (Me too)
        enabled_label: Botão "Eu também" no primeiro post
        enabled_help: 'A pílula "✋ Eu também" abaixo do primeiro post: quem tem o mesmo problema clica, a contagem aparece entre parênteses e a pessoa passa a acompanhar a discussão. O autor e as discussões trancadas veem o botão só para leitura; visitantes são levados ao login. Desligado, o botão some e a API responde 404; as marcações ficam guardadas.'
        tags_label: Onde o botão aparece
        tags_help: 'Marque as tags de suporte (por exemplo: Suporte, Bug…). Nenhuma marcada vale para todas as discussões. Marcar uma tag pai inclui as filhas.'
        tags_loading: Carregando as tags…
        tags_some: '{count, plural, one {# selecionada} other {# selecionadas}}'
        tags_all: Todas as tags
        tags_clear: Limpar (todas)
        hide_solved_label: Esconder quando a discussão tiver solução
        hide_solved_help: Com a melhor resposta escolhida (FoF Best Answer), o botão some, e volta se a solução for retirada. Desligado, continua na discussão resolvida (o modo "várias soluções").
        follow_label: Quem marca passa a seguir a discussão
        follow_help: Ao clicar em "Eu também", a pessoa passa a seguir a discussão (extensão Inscrições) para saber da solução. Quem já segue continua igual; desmarcar não deixa de seguir.
        no_best_answer_notice: 'Sem a extensão FoF Best Answer, nenhuma discussão conta como resolvida: o botão fica em todas as discussões escolhidas.'
      profile:
        blocked_by_master: Ligue os campos extras no card "Perfil estendido".
        characters_suffix: caracteres
        section_main: Perfil estendido
        profile_enabled_label: Campos extras no perfil
        profile_enabled_help: 'Os campos de perfil: cada pessoa conta quem é, onde está e o que anda fazendo. Desligado, os campos somem do fórum e da API, mas o que já foi preenchido fica guardado.'
        profile_bio_label: Sobre mim (bio)
        profile_bio_help: Texto curto no perfil e no cartão de usuário. Aceita links, **negrito**, *itálico* e `código`; nenhum HTML.
        profile_bio_max_length_label: Tamanho máximo da bio
        profile_bio_max_length_help: De {min} a {max} caracteres.
        profile_location_label: Localização
        profile_location_help: Cidade ou região, com um ícone de mapa no perfil.
        profile_website_label: Site
        profile_website_help: Um endereço http ou https, que abre em outra aba e não passa autoridade de busca (nofollow).
        profile_birthday_label: Aniversário
        profile_birthday_help: Data de nascimento opcional. Os outros veem só o dia e o mês, a menos que a pessoa escolha mostrar o ano.
        section_title: Título do usuário
        profile_title_label: Título abaixo do nome
        profile_title_help: Um título curto (até 60 caracteres) no perfil, no cartão e ao lado do nome nos posts.
        profile_title_self_label: Cada pessoa escolhe o próprio título
        profile_title_self_help: Desligado, só quem pode editar usuários (a moderação) define títulos, como uma distinção dada pela equipe.
        section_status: Status do usuário
        profile_status_label: Status com emoji
        profile_status_help: Um emoji e uma frase ("🌴 De férias até sexta") ao lado do nome nos posts, no cartão e no avatar do cabeçalho. A pessoa escolhe quando o status some sozinho.
        section_cover: Capa e fundo do cartão
        profile_cover_label: Imagens do perfil
        profile_cover_help: Uma capa larga no topo do perfil e um fundo para o cartão de usuário. Sem imagem, a capa usa a cor do usuário.
        profile_cover_upload_label: Permitir envio de imagem
        profile_cover_upload_help: As imagens são reduzidas (a capa a 2000px, o cartão a 900px), convertidas para WebP e guardadas em assets/canela-covers. Desligado, só valem imagens de outros sites, se permitidas abaixo.
        cover_notice: Endereços externos precisam ser https. O navegador de quem visita o perfil busca a imagem direto no outro site.
        cover_forumaker_notice: 'A forumaker/profile-cover está ativa: a capa do perfil vem dela (Integrações → Capa do perfil). O fundo do cartão continua do tema; sem um fundo próprio, o cartão usa a miniatura da capa dela. A capa enviada aqui fica guardada, mas não aparece enquanto ela mandar.'
        profile_external_images_label: "Permitir imagens de outros sites"
        profile_external_images_help: "Aceita o endereço https de uma imagem para a capa e o fundo do cartão. O navegador de quem visita busca a imagem direto no outro site, que pode rastrear quem viu o perfil."
      stats:
        section_links: Cliques em links
        stats_links_enabled_label: Contar cliques em links
        stats_links_enabled_help: 'Cada clique num link externo de uma postagem é contado: o número aparece ao lado do link, os "Links populares" no mapa da discussão e os "Melhores links" no resumo do perfil.'
        links_notice: Um clique por link por pessoa (ou IP, para visitantes) a cada 24 horas; robôs não contam. Só links externos que estão na postagem.
        section_views: Visualizações de discussão
        stats_views_enabled_label: Contar visualizações
        stats_views_enabled_help: Cada discussão conta quantas vezes foi aberta. O número aparece na coluna Visualizações da lista e permite ordenar por mais vistas.
        stats_view_window_hours_label: Horas até contar a mesma pessoa de novo
        stats_view_window_hours_help: Conte uma nova visualização de discussão uma vez por IP/usuário(a) a cada N horas, e sempre de novo num dia novo. De {min} a {max} horas; o padrão é 8.
        hours_suffix: horas
        views_notice: 'Uma visualização por discussão por dia para cada conta (ou IP, para visitantes), travada pelas horas acima; só conta quem pode ver a discussão, e robôs não contam. O IP de quem está na conta não é guardado, e o de visitantes fica só como um código com sal, nunca o IP em si. Cada dia fica guardado para o gráfico "Visualizações recentes" do mapa da discussão.'
        heat_title: Realce da coluna Visualizações
        heat_help: As cores de calor da coluna Visualizações da lista (mapa de calor). Valem quando "Destacar contagens altas" está ligado na Lista de discussões.
        topic_views_heat_low_label: Realce leve a partir de
        topic_views_heat_low_help: Após uma quantidade de visualizações, o campo de visualizações é levemente realçado. O padrão é 1000.
        topic_views_heat_medium_label: Realce moderado a partir de
        topic_views_heat_medium_help: Após esta quantidade de visualizações, o campo de visualizações é moderadamente realçado. O padrão é 2000.
        topic_views_heat_high_label: Realce forte a partir de
        topic_views_heat_high_help: Após esta quantidade de visualizações, o campo de visualizações é fortemente realçado. O padrão é 3500.
        views_suffix: visualizações
        section_counts: Contagem de novos e não lidos
        stats_counts_enabled_label: Mostrar as contagens
        stats_counts_enabled_help: 'Para quem entrou na conta: "Novos (3)" e "Não lidos (2)" nas abas da lista, e um ponto ao lado de Todas as Discussões na barra lateral quando há novidade.'
        stats_new_days_label: Dias em que uma discussão é nova
        stats_new_days_help: Discussões criadas nesse período que a pessoa ainda não abriu. 0 conta tudo desde o cadastro ou o último "marcar tudo como lido". De {min} a {max}; o padrão é 2.
        days_suffix: dias
        section_activity: Atividade no perfil
        stats_activity_enabled_label: Registrar a atividade
        stats_activity_enabled_help: Dias visitados, tempo de leitura (total e dos últimos 60 dias), postagens lidas, discussões vistas e curtidas dadas e recebidas, no resumo do perfil.
        activity_notice: O tempo de leitura só conta com a aba visível e alguém mexendo na página. Os números começam do zero no dia em que o recurso é ligado; discussões vistas dependem de Visualizações ligado.
      ramon_chat_features:
        group_moderation: "Moderação"
        review_flags_label: "Denúncias do chat em \"Revisar\""
        review_flags_help: "As mensagens do chat denunciadas entram na fila de revisão do tema (página, barra lateral e menu do usuário), junto com as postagens e na ordem das datas, para quem vê as sinalizações ou modera o chat."
        title: "Recursos extras do chat (ramon/chat)"
        description: "O que falta no ramon/chat: avisos no sino, reações de um clique, \"Nova mensagem\", favoritos, link da mensagem, \"está digitando\" sem websocket e mais: sem mudar a extensão."
        backend_off: "O recurso \"ramonchat\" do tema não carregou (veja o log de erros do PHP)."
        group_reader: "Para o leitor"
        group_messages: "Mensagens"
        group_channels: "Canais e MDs"
        dm_max_label: "Participantes por MD"
        dm_max_help: "Contando quem começa a conversa. O ramon/chat aceita no máximo 20."
        preferences_label: "Seção \"Chat\" nas Configurações"
        preferences_help: "Ativar o chat, som, indicador do cabeçalho, tecla de enviar, reações de um clique, gaveta, e-mail de menções e \"Ignorar menções em todo o canal\"."
        header_indicator_label: "Indicador do cabeçalho configurável"
        header_indicator_help: "O leitor escolhe o que o botão do chat conta: todas as novas, MDs e menções, só menções ou nada."
        drawer_shortcut_label: "Atalho \"-\" para a gaveta"
        drawer_shortcut_help: "Abre e fecha a gaveta do chat."
        bell_label: "Avisos no sino"
        bell_help: "Menções (@here só para quem esteve ativo nos últimos 5 minutos) e mensagens novas nos canais acompanhados viram notificações; ler o canal as marca como lidas."
        quick_reactions_label: "Reações de um clique"
        quick_reactions_help: "As três reações mais usadas pelo leitor (ou as que ele escolher) ao lado do 👍."
        permalink_label: "Link da mensagem"
        permalink_help: "\"Copiar link\" nas ações e o endereço que abre a conversa na mensagem."
        restore_label: "Restaurar mensagem excluída"
        restore_help: "O botão no aviso de mensagem excluída, para quem pode restaurá-la."
        long_press_label: "Ações por toque longo no celular"
        long_press_help: "Segurar a mensagem abre a folha de ações que sobe de baixo."
        collapse_deleted_label: "Agrupar excluídas em sequência"
        collapse_deleted_help: "\"N mensagens foram excluídas\" numa linha só, com \"ver todas\"."
        paste_upload_label: "Colar e arrastar imagens"
        paste_upload_help: "Imagens e arquivos colados ou soltos no compositor são enviados como anexo."
        mention_warning_label: "Aviso de quem não participa"
        mention_warning_help: "No @ do compositor, quem não está no canal aparece com \"não participa do canal\"."
        typing_poll_label: "\"Está digitando\" sem websocket"
        typing_poll_help: "Sem o flarum/realtime, quem está com a conversa aberta pergunta ao servidor a cada 3 segundos."
        new_message_label: "\"Nova mensagem\""
        new_message_help: "O modal de MD e MD em grupo (busca de pessoas, contador, nome do grupo) e o \"+\" das Mensagens diretas."
        self_dm_label: "MD consigo mesmo (\"Anotar algo\")"
        self_dm_help: "Uma conversa só sua, para anotações."
        group_name_label: "Nome do chat em grupo"
        group_name_help: "Qualquer participante muda o nome da conversa em grupo."
        starred_label: "Canais favoritos"
        starred_help: "A estrela no cabeçalho e nas Informações do canal; os favoritos vão para o topo da barra lateral."
        pin_bar_label: "Faixa das fixadas"
        pin_bar_help: "A faixa acompanha o trecho da conversa à vista, com o indicador de várias fixadas; clicar percorre todas, o \"×\" oculta a faixa só para o leitor, e o painel lista na ordem da conversa, com quem fixou."
        pin_indicator_label: "Fixadas não vistas"
        pin_indicator_help: "Um ponto na faixa da mensagem fixada quando há fixada que o leitor ainda não abriu."
        retention_label: "Lembrete de retenção"
        retention_help: "Por quanto tempo as mensagens ficam guardadas, nas Informações do canal."
        delete_confirm_label: "Excluir canal digitando o nome"
        delete_confirm_help: "Excluir um canal pede o nome dele digitado, em vez de um \"OK\"."
        auto_join_label: "Entrar sozinho nos canais automáticos"
        auto_join_help: "Quem ganhou acesso depois entra nos canais com \"Adicionar usuários automaticamente\" (no máximo uma vez por dia por pessoa)."
        tag_cleanup_label: Apagar os canais da tag apagada
        tag_cleanup_help: Ao apagar uma tag, os canais dela são excluídos.
        dm_guard_label: "Regras das MDs"
        dm_guard_help: "Recusa MD com quem não pode usar o chat ou o desligou, e aplica o limite de participantes abaixo."
    system_user:
      title: "Usuário do sistema"
      help: "Uma conta de sistema: assina as notificações automáticas (lembretes de marcador e emblemas) e as mensagens automáticas abaixo. É um usuário comum no fórum, com perfil, avatar e bio, mas nunca entra: não tem login, senha, redefinição de senha nem sessão. Ninguém consegue mandar mensagem para ele, e ele fica fora da lista de usuários."
      bio: "Não é uma pessoa de verdade. Um usuário global para notificações e outras tarefas do sistema."
      create: "Criar usuário do sistema"
      created_as: "Usuário do sistema: {name}"
      open_profile: "Abrir o perfil"
      profile_hint: "Troque o avatar, o nome e a bio pelo perfil dele, como em qualquer usuário."
      unlink: "Desvincular"
      unlink_confirm: "Desvincular o usuário do sistema? A conta continua existindo, mas as notificações voltam a sair sem remetente e as mensagens automáticas param até você criar ou vincular outro."
      missing: "Ainda não há usuário do sistema. Sem ele, as notificações automáticas saem sem remetente e nenhuma mensagem automática é enviada."
      messages_notice: "As mensagens automáticas são mensagens privadas: precisam da extensão Mensagens (flarum/messages) ligada."
      needs_user: "Crie o usuário do sistema primeiro (card acima)."
      no_replies_notice: "A conversa com o usuário do sistema é só de ida: quem recebe não pode responder, porque ninguém lê a caixa dele."
    sysmsg:
      custom:
        title: "Mensagens personalizadas"
        help: "Mensagens suas, além das que já vêm prontas: escolha quando cada uma sai (conta ativada, dias depois, grupo, nível, emblema, primeira postagem, aniversário de conta, conta verificada). Cada uma sai uma vez só por pessoa."
        empty: "Nenhuma mensagem personalizada ainda."
        add: "Adicionar mensagem"
        remove: "Apagar"
        remove_confirm: "Apagar esta mensagem automática?"
        enabled: "Ligada"
        title_label: "Nome da mensagem (só no admin)"
        when: "Quando"
        which: "Qual"
        choose: "Escolha…"
        trigger_activated: "Conta ativada"
        trigger_group: "Entrou num grupo"
        trigger_trust_level: "Chegou a um nível de confiança"
        trigger_badge: "Ganhou um emblema"
        trigger_first_post: "Publicou a primeira postagem"
        trigger_anniversary: "Aniversário de conta"
        trigger_verified: "Conta verificada (ramon/verified)"
        level_1: "1 - Básico"
        level_2: "2 - Membro"
        level_3: "3 - Regular"
        level_4: "4 - Líder"
        delay_label: "Dias depois"
        delay_suffix: "dias depois (0 = na hora)"
        delay_help: "Sai pelo agendador do Flarum (php flarum schedule:run no cron), e só para quem se cadastrar depois de a mensagem ser criada."
        years_label: "Anos de conta"
        years_suffix: "ano(s) de conta"
        anniversary_help: "Sai pelo agendador do Flarum no dia do aniversário de cadastro, só para aniversários depois de a mensagem ser criada."
      fields:
        subject: "Assunto"
        body: "Texto"
        default_hint: "Vazio, vale o texto padrão (o do campo, em cinza), no idioma de quem recebe."
        use_default: "Editar a partir do padrão"
        restore_default: "Voltar ao padrão"
        variables: "Variáveis: {list}"
      welcome_user:
        title: "Boas-vindas"
        help: "Para quem acabou de ativar a conta (confirmou o e-mail, ou entrou já confirmado). Sai uma vez só por pessoa."
        subject: "Boas-vindas ao %{site_name}!"
        body: |-
          Obrigado por entrar no %{site_name}, e seja bem-vindo(a)!

          Acreditamos em [comportamento civilizado](%{guidelines_url}) na comunidade, sempre.

          Aproveite!
      welcome_invite:
        title: "Boas-vindas por convite"
        help: "No lugar das boas-vindas comuns, para quem entrou por um link de convite."
        subject: "Boas-vindas ao %{site_name}!"
        body: |-
          Obrigado por aceitar o convite para o %{site_name}, e seja bem-vindo(a)!

          - Criamos a conta **%{username}** para você. Troque o nome ou a senha nas [suas configurações](%{user_preferences_url}).

          Acreditamos em [comportamento civilizado](%{guidelines_url}) na comunidade, sempre.

          Aproveite!
      welcome_tl1_user:
        title: "Nível de confiança 1"
        help: "Quando a pessoa sobe para o nível 1 (Básico). Precisa dos níveis de confiança ligados."
        subject: "Obrigado por passar um tempo com a gente"
        body: |-
          Oi! Vimos que você tem lido bastante, o que é ótimo, então subimos você um nível de confiança!

          Ficamos felizes que você esteja passando um tempo com a gente e adoraríamos saber mais sobre você. Tire um momento para [preencher o seu perfil](%{user_url}) ou fique à vontade para [começar uma discussão](%{base_url}).
      tl2_promotion_message:
        title: "Nível de confiança 2"
        help: "Quando a pessoa sobe para o nível 2 (Membro). Precisa dos níveis de confiança ligados."
        subject: "Parabéns pela promoção de nível de confiança!"
        body: |-
          Subimos você mais um nível de confiança!

          Chegar ao nível 2 significa que você leu e participou o bastante para ser considerado(a) membro desta comunidade.

          Continue participando: a gente gosta de ter você por aqui.
      welcome_staff:
        title: "Entrou para a equipe"
        help: "Quando a pessoa entra no grupo Admin ou Moderadores."
        subject: "Parabéns, você agora faz parte da equipe (%{role})!"
        body: |-
          Você recebeu o papel de %{role} de outro membro da equipe.

          Com ele vêm as ferramentas da equipe, e com grandes poderes vêm grandes responsabilidades. Se moderação é novidade para você, leia as [diretrizes da comunidade](%{guidelines_url}).
      user_added_to_group_as_member:
        title: "Adicionado a um grupo"
        help: "Quando a pessoa entra em outro grupo (fora Admin e Moderadores). Desligada por padrão."
        subject: "Você entrou no grupo %{group_name}"
        body: "Você foi adicionado(a) como membro do grupo [%{group_name}](%{base_url}%{group_path})."
      flags_agreed_and_post_deleted:
        title: "Post denunciado removido"
        help: "Quando a equipe oculta ou apaga um post que tinha denúncias. Precisa da extensão Denúncias (flarum/flags)."
        subject: "Post denunciado removido pela equipe"
        body: |-
          Olá,

