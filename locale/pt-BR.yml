      list_status_icons_colored: 'Colorido: cada ícone com a sua cor'
      section_categories_page: Página de tags
      categories_layout_label: Formato
      categories_layout_help: Como a página de todas as tags as apresenta.
      categories_layout_boxes: 'Caixas: cartões com a cor, a descrição e as tags filhas'
      categories_layout_list: 'Lista: uma tabela de tags com as discussões mais recentes'
      section_topic_map: Mapa da discussão
      topic_map_label: Mapa da discussão
      topic_map_help: Abaixo da primeira postagem, um resumo com a data de criação, a última resposta, o número de respostas e quem participou.
      section_topic_timeline: Linha do tempo
      topic_timeline_label: Linha do tempo ao lado das postagens
      topic_timeline_help: A barra à direita que mostra em que ponto da discussão se está e leva a qualquer postagem dela.
      section_topic_footer: Rodapé da discussão
      topic_footer_label: Botões no fim da discussão
      topic_footer_help: Responder, compartilhar e acompanhar depois da última postagem. Acompanhar precisa da extensão Subscriptions.
      topic_footer_notifications_label: "Acompanhar no rodapé (computador)"
      topic_footer_notifications_help: "O botão \"Acompanhando\" e a frase do nível de notificação abaixo dos botões do rodapé. No computador o sino da linha do tempo já faz o mesmo; no celular e no tablet o do rodapé sempre aparece, porque é o único."
      section_suggested: Discussões sugeridas
      suggested_topics_label: Mostrar discussões sugeridas
      suggested_topics_help: No fim da discussão, uma lista curta de outras discussões para continuar lendo, de preferência da mesma tag.
      suggested_count_label: Quantidade
      suggested_count_help: Quantas discussões sugerir, de {min} a {max}.
      section_user_page: Página de perfil
      user_cover_label: Capa no topo do perfil
      user_cover_help: Uma faixa larga atrás do avatar grande e do nome.
      user_stats_label: Estatísticas
      user_stats_help: Quando entrou, a última visita e os números de postagens e discussões, abaixo do nome. As curtidas só aparecem com a extensão Likes.
      user_summary_label: Aba Resumo
      user_summary_help: Uma aba inicial com os números do usuário e as suas discussões e respostas de destaque.
      user_activity_read_label: Subaba Lidos
      user_activity_read_help: Em Atividade, as discussões que a pessoa leu, da mais recente para a mais antiga. Só a própria pessoa e os administradores a veem.
      user_activity_reactions_label: Subaba Reações
      user_activity_reactions_help: Em Atividade, curtidas e reações que a pessoa deu numa lista só, no lugar de Curtidas, com o emoji e o trecho da postagem. As reações só aparecem para quem tem a permissão de ver quem reagiu.
      user_activity_votes_label: Subaba Votos
      user_activity_votes_help: Em Atividade, as postagens com enquetes em que a pessoa votou. Para os outros, só as enquetes que mostram os votantes.
      user_activity_solved_label: Subaba Resolvido
      user_activity_solved_help: Em Atividade, as respostas da pessoa escolhidas como melhor resposta.
      section_user_card: Cartão de usuário
