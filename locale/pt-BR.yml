        badges_max_likes_per_day_label: Curtidas por dia dos emblemas "Por amor"
        badges_max_likes_per_day_help: O Flarum não limita curtidas; os emblemas Por amor, Amor maior e Apaixonado(a) contam os dias em que a pessoa deu pelo menos este número de curtidas (o padrão é 50).
        run_now: Conceder emblemas agora
        run_done: Pronto.
        run_help: O comando canela:badges roda uma vez por dia pelo agendador do Flarum (php flarum schedule:run no cron). A primeira carga concede o histórico do fórum sem notificar ninguém. Este botão roda só a parte dos emblemas, agora.
        trust_levels_enabled_label: Níveis de confiança
        trust_levels_enabled_help: 'Novo, Básico, Membro, Regular e Líder, calculados pelos requisitos do card abaixo. O nível aparece no perfil e rende os emblemas de nível. O Líder só é dado à mão: no perfil, menu de moderação, "Alterar nível de confiança…".'
