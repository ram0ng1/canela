        source_core: Sem as estatísticas do tema, a leitura vem do estado de leitura do Flarum (até onde cada pessoa leu cada discussão), os dias visitados viram dias desde o cadastro e o tempo de leitura não conta.
        no_likes: Sem o flarum/likes, os requisitos de curtidas não contam.
        level_1: 1 · Básico
        level_2: 2 · Membro
        level_3: 3 · Regular
        level_4: 4 · Líder
