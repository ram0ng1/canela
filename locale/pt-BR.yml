        general_description: Bot de IA de propósito geral capaz de realizar várias tarefas
        general_prompt: Você é um assistente útil, simpático e direto. Ajude com qualquer pergunta. Quando a pergunta tiver a ver com o fórum, as discussões dele ou a comunidade, pesquise no fórum antes de responder.
        forum_researcher_name: Pesquisador do Fórum
        forum_researcher_description: O bot especializado em pesquisa profunda no fórum
        forum_researcher_prompt: Você é um pesquisador meticuloso do fórum. Para cada pergunta, faça várias buscas com termos diferentes, leia as discussões mais relevantes e escreva uma resposta completa e organizada, com as conclusões e os links de cada discussão usada. Diga claramente quando o fórum não tiver a informação.
        creative_name: Criativa
        creative_description: Bot de IA sem integrações externas especializado em tarefas criativas
        creative_prompt: 'Você é um assistente criativo: ajuda a escrever, a ter ideias, a revisar textos e a explorar possibilidades, com imaginação e bom gosto.'
        researcher_name: Pesquisador da Web
        researcher_description: O bot de IA que pesquisa e lê páginas na web
        researcher_prompt: Você é um pesquisador. Pesquise na web para responder com informações atuais e cite as fontes com links.
    badges:
      first_like:
        name: Primeira curtida
        description: Curtiu uma postagem
        long_description: Este emblema é concedido na primeira vez que você curtir uma postagem. Curtir postagens é uma ótima maneira de mostrar aos outros membros da comunidade que o que postaram era interessante, útil, legal ou divertido. Compartilhe o amor!
      first_quote:
        name: Primeira citação
        description: Citou uma postagem
        long_description: Este emblema é concedido na primeira vez que você citar uma postagem em uma resposta. Citar partes relevantes de postagens anteriores na sua resposta ajuda a manter as discussões conectadas e a não sair do tópico. A maneira mais fácil de citar é selecionar uma parte de uma postagem e usar o botão de citar. Cite à vontade!
      first_link:
        name: Primeiro link
        description: Adicionou um link para outra discussão
        long_description: Este emblema é concedido na primeira vez que você vincula outra discussão. Vincular discussões ajuda colegas leitores(as) a encontrar conversas relacionadas interessantes, mostrando as conexões entre as discussões. Sinta-se livre para adicionar links!
      first_mention:
        name: Primeira menção
        description: Mencionou um(a) usuário(a) em uma postagem
        long_description: Este emblema é concedido na primeira vez em que você menciona o @nome_de_usuário de alguém na sua postagem. Cada menção gera uma notificação para essa pessoa, para que saiba sobre sua postagem. Basta começar a digitar @ (arroba) para mencionar qualquer usuário(a). É uma maneira conveniente de chamar a atenção de outras pessoas para algo.
      first_emoji:
        name: Primeiro emoji
        description: Utilizou um emoji em uma postagem
        long_description: 'Este emblema é concedido na primeira vez que você adicionar um emoji à sua postagem. Emojis permitem que você transmita emoção em suas postagens, de felicidade até tristeza, raiva e todo o resto. Basta digitar : (dois pontos) para escolher uma das centenas de opções.'
      first_flag:
        name: Primeiro sinalizador
        description: Sinalizou uma postagem
        long_description: Este emblema é concedido na primeira vez que você sinaliza uma postagem. Sinalizar é uma forma de ajudar a manter este local agradável para todos. Se você perceber qualquer postagem que exija atenção da moderação por qualquer motivo, não hesite em sinalizar.
      editor:
        name: Editor(a)
        description: Primeira edição de postagem
        long_description: 'Este emblema é concedido na primeira vez que você edita uma de suas postagens. Incentivamos a edição: você pode melhorar a formatação, corrigir pequenos erros ou adicionar alguma coisa que tenha esquecido quando postou pela primeira vez. Faça edições para tornar suas postagens ainda melhores!'
      autobiographer:
        name: Autobiógrafo
        description: Preencheu informações de perfil
        long_description: Este emblema é concedido por preencher seu perfil de usuário(a) e selecionar uma foto de perfil. Permitir que saibam um pouco mais sobre quem você é e sobre os seus interesses contribui para uma comunidade melhor e mais conectada. Junte-se a nós!
      reader:
        name: Leitor(a)
        description: Leu todas as respostas em uma discussão com mais de 100 respostas
        long_description: Este emblema é concedido na primeira vez que você lê uma discussão longa com mais de 100 respostas. Ler uma conversa atentamente ajuda a acompanhar a discussão, entender diferentes pontos de vista, além de levar a assuntos mais interessantes. Quanto mais você lê, melhor a conversa fica.
      new_user_of_the_month:
        name: Novo(a) usuário(a) do mês
        description: Contribuições notáveis no primeiro mês
        long_description: Este emblema é concedido para parabenizar dois(duas) novos(as) usuários(as) a cada mês por suas excelentes contribuições gerais, de acordo com quantas pessoas curtiram suas postagens.
      welcome:
        name: Boas-vindas
        description: Recebeu uma curtida
        long_description: Este emblema é concedido quando você recebe sua primeira curtida em uma postagem. Parabéns, você postou algo que sua comunidade achou interessante, legal ou útil!
      anniversary:
        name: Aniversário
        description: Membro ativo por um ano, postou ao menos uma vez
        long_description: Este emblema é concedido quando você é membro por um ano com pelo menos uma postagem neste ano. Obrigado por ficar e contribuir para a nossa comunidade. Nosso trabalho não seria possível sem você.
      appreciated:
        name: Apreciado
        description: Recebeu uma curtida em 20 postagens
        long_description: Este emblema é concedido quando você recebe ao menos uma curtida em 20 postagens diferentes. A comunidade está gostando das suas contribuições para as conversas!
      respected:
        name: Respeitado(a)
        description: Recebeu 2 curtidas em 100 postagens
        long_description: Este emblema é concedido quando você recebe ao menos duas curtidas em 100 postagens diferentes. A comunidade está desenvolvendo respeito por suas várias contribuições e conversas aqui.
      admired:
        name: Admirado(a)
        description: Recebeu cinco curtidas em 300 postagens
        long_description: Este emblema é concedido quando você recebe pelo menos cinco curtidas em 300 postagens diferentes. Uau! A comunidade admira suas contribuições frequentes e de alta qualidade para as conversas aqui.
      thank_you:
        name: Obrigado
        description: Teve 20 postagens curtidas e curtiu dez postagens
        long_description: Este emblema é concedido quando você tem 20 postagens curtidas e dá 10 curtidas ou mais em troca. Quando alguém curte suas postagens, você dedica tempo para curtir o que os(as) outros(as) estão postando também.
      gives_back:
        name: Retribuidor(a)
        description: Curtiu 100 postagens e teve 100 postagens curtidas
        long_description: Este emblema é concedido quando você tem 100 postagens curtidas e dá 100 curtidas ou mais em troca. Obrigado por passar para frente!
      empathetic:
        name: Empático(a)
        description: Curtiu 1.000 postagens e teve 500 postagens curtidas
        long_description: Este emblema é concedido quando você tem 500 postagens curtidas e dá 1.000 curtidas ou mais em troca. Uau! Você é um modelo de generosidade e apreciação mútua.
      out_of_love:
        name: Por amor
        description: Usou {max} curtidas no mesmo dia
        long_description: Este emblema é concedido quando você dá {max} curtidas num mesmo dia. Lembre-se de que curtir as suas postagens favoritas incentiva seus colegas da comunidade a criar ainda mais discussões de qualidade no futuro.
      higher_love:
        name: Amor maior
        description: Usou {max} curtidas no mesmo dia cinco vezes
        long_description: Este emblema é concedido quando você dá {max} curtidas num mesmo dia, em cinco dias diferentes. Agradecemos por dedicar um tempo para incentivar ativamente as melhores conversas todos os dias!
      crazy_in_love:
        name: Apaixonado(a)
        description: Usou {max} curtidas no mesmo dia 20 vezes
        long_description: Este emblema é concedido quando você dá {max} curtidas num mesmo dia, em 20 dias diferentes. Uau! Você é um exemplo para incentivar os membros da comunidade!
      enthusiast:
        name: Entusiasta
        description: Acessou durante dez dias consecutivos
        long_description: Este emblema é concedido ao acessar durante dez dias consecutivos. Obrigado por ficar com a gente por mais de uma semana!
      aficionado:
        name: Aficionado(a)
        description: Acessou durante 100 dias consecutivos
        long_description: Este emblema é concedido por acessar durante 100 dias consecutivos. Isso é mais do que três meses!
      devotee:
        name: Devoto(a)
        description: Acessou 365 dias consecutivos
        long_description: Este emblema é concedido por ter acessado 365 dias consecutivos. Uau, um ano inteiro!
      nice_post:
        name: Resposta interessante
        description: Recebeu dez curtidas em uma resposta
        long_description: Este emblema é concedido quando sua resposta recebe dez curtidas. Sua resposta causou uma boa impressão na comunidade e ajudou a levar a conversa adiante.
      good_post:
        name: Resposta boa
        description: Recebeu 25 curtidas em uma resposta
        long_description: Este emblema é concedido quando sua resposta recebe 25 curtidas. Sua resposta foi excepcional e tornou a conversa muito mais interessante.
      great_post:
        name: Resposta excelente
        description: Recebeu 50 curtidas em uma resposta
        long_description: Este emblema é concedido quando sua resposta recebe 50 curtidas. Uau! Sua resposta foi inspiradora, fascinante, hilária ou perspicaz, e a comunidade adorou!
      nice_topic:
        name: Discussão interessante
        description: Recebeu 10 curtidas em uma discussão
        long_description: Este emblema é concedido quando sua discussão recebe 10 curtidas. Você começou uma conversa interessante que a comunidade gostou.
      good_topic:
        name: Boa discussão
        description: Recebeu 25 curtidas em uma discussão
        long_description: Este emblema é concedido quando sua discussão recebe 25 curtidas. Você começou uma conversa eletrizante que movimentou a comunidade.
      great_topic:
        name: Discussão excelente
        description: Recebeu 50 curtidas em uma discussão
        long_description: Este emblema é concedido quando sua discussão recebe 50 curtidas. Você começou uma conversa fascinante e a comunidade amou toda a discussão que ela gerou!
      basic_user:
        name: Básico
        description: Concedido uso de todas as funções essenciais da comunidade
        long_description: Este emblema é concedido quando você atinge o nível de confiança 1. Obrigado por acompanhar o fórum e ler algumas discussões para aprender o que é a nossa comunidade.
      member:
        name: Membro
        description: Concedida a confiança de quem participa há semanas
        long_description: Este emblema é concedido quando você atinge o nível de confiança 2. Obrigado por participar durante semanas para se juntar à nossa comunidade.
      regular:
        name: Regular
        description: Concedida a confiança de um(a) colaborador(a) constante
        long_description: Este emblema é concedido quando você atinge o nível de confiança 3. Obrigado por ser uma parte constante de nossa comunidade há meses. Agora você é um dos leitores(as) mais ativos(as) e um(a) colaborador(a) confiável que torna a nossa comunidade excelente.
      leader:
        name: Líder
        description: Escolhido(a) pela equipe como exemplo para a comunidade
        long_description: Este emblema é concedido ao alcançar o nível de confiança 4. Você é um(a) líder desta comunidade, conforme selecionado(a) pela equipe, e dá um exemplo positivo para o restante dos integrantes com suas ações e palavras.
