        about_contact_url_label: Página de contato
        about_contact_url_help: Um endereço completo (https://…) para um formulário ou página de contato.
        about_show_staff_label: Mostrar a equipe
        about_show_staff_help: As listas "Nossos administradores" e "Nossos moderadores". Grupos ocultos ficam de fora para quem não pode vê-los.
        about_show_stats_label: Mostrar as estatísticas do site
        about_show_stats_help: Discussões, postagens, cadastros, usuários ativos e curtidas nas últimas 24 horas, 7 dias, 30 dias e desde sempre.
        stats_notice: Os números contam só o que é público e são recalculados a cada 30 minutos.
        section_legal: Diretrizes, termos e privacidade
        guidelines_enabled_label: Página Diretrizes (/guidelines)
        guidelines_enabled_help: As regras de convivência do fórum, numa aba ao lado de Sobre e no menu "Mais" da barra lateral. /faq leva à mesma página. A página só aparece com conteúdo (o texto abaixo ou uma página do fof/pages).
        guidelines_page_label: Página do fof/pages
        guidelines_page_none: "Nenhuma: usar o texto abaixo"
        guidelines_page_help: Escolhida uma página, o /guidelines mostra o conteúdo dela (com a visibilidade do próprio fof/pages) e o texto abaixo deixa de valer. O conteúdo passa a ser editado em fof/pages. Com o texto vazio, a página criada parte do modelo do tema.
        guidelines_page_create: 'Criar a página "Diretrizes" com o texto atual'
        guidelines_text_label: Texto das diretrizes
        guidelines_text_help: Aceita Markdown e BBCode; com tags HTML, vai como HTML. Vazio e sem página do fof/pages, a página Diretrizes não aparece.
        section_about_pages: Páginas da área Sobre
        about_pages_help: 'Acrescente quantas páginas do fof/pages quiser como abas ao lado de Sobre e Diretrizes, cada uma com o layout de regras: título, índice de seções e cartões.'
        about_pages_list_help: Cada página vira uma aba depois de Sobre e Diretrizes, na ordem da lista, com o endereço /about/id-slug e o mesmo layout das Diretrizes. O rótulo vazio usa o título da página; o ícone é uma classe do Font Awesome. Páginas ocultas ou restritas no fof/pages só aparecem para quem pode vê-las.
        about_pages_add: Adicionar uma página…
        about_pages_none_left: Todas as páginas do fof/pages já estão na lista
        about_pages_missing: 'Página #{id} (não encontrada)'
        about_pages_label: Rótulo da aba
        about_pages_icon: Ícone (opcional)
        about_pages_up: Subir
        about_pages_down: Descer
        about_pages_remove: Tirar da área Sobre
        tos_url_label: Endereço dos Termos de Serviço
        tos_url_help: A aba "Termos de Serviço" e o endereço /tos levam para cá. Uma política do FoF Terms com "termos" no nome tem preferência.
        privacy_url_label: Endereço da Política de Privacidade
        privacy_url_help: A aba "Política de Privacidade" e o endereço /privacy levam para cá. Uma política do FoF Terms com "privacidade" no nome tem preferência.
        legal_notice: Sem endereço (aqui ou no FoF Terms), a aba não aparece. As outras políticas do FoF Terms entram como abas com o próprio nome.
        section_directory: Diretório de usuários
        directory_enabled_label: Página Usuários (/u)
        directory_enabled_help: Uma tabela com curtidas recebidas e dadas, discussões, respostas e último acesso de cada pessoa, por período, ordenável por coluna.
        directory_guests_label: Visitantes também podem ver
        directory_guests_help: Por padrão, só quem tem a permissão "Ver a lista de usuários" (em Permissões) vê o diretório e os membros dos grupos. Ligado, visitantes sem conta também veem, menos num fórum fechado.
        directory_notice: As colunas de curtidas aparecem com a extensão Likes ligada; Visitas e Postagens lidas, com as estatísticas do tema. Ordenar por último acesso segue a permissão do core de ver quando cada um esteve online.
        section_groups: Grupos
