      toast_auto_close_label: Avisos que fecham sozinhos
      toast_auto_close_help: Os avisos do canto da tela ("Salvo", "Link copiado"…) somem sozinhos depois de alguns segundos, com a barrinha de tempo. Desligado, ficam até alguém fechar.
      user_menu_label: Menu do usuário do tema
      user_menu_help: O avatar do cabeçalho abre o painel com as abas de notificações, respostas, curtidas, mensagens, marcadores, chat, revisão e perfil (no lugar do sino e do menu da sessão do Flarum).
      nav_sticky_label: Abas grudadas no topo
      nav_sticky_help: Ao rolar a lista, a barra das abas fica presa embaixo do cabeçalho.
      list_infinite_scroll_label: Rolagem infinita
      list_infinite_scroll_help: A próxima página da lista carrega sozinha quando o fim chega perto da tela. Desligada, fica o botão "Carregar mais" do Flarum.
      post_actions_label: Barra de ações do tema
      post_actions_help: Curtir, copiar o link, marcar, responder e o "…" que expande o resto, na barra de cada postagem. Desligada, volta o menu de controles do Flarum.
      embedded_replies_label: Respostas embutidas
      embedded_replies_help: O "N respostas" de cada postagem abre as respostas ali mesmo, embaixo dela, e a postagem citada aparece acima.
      post_style_label: Estilo das postagens
      post_style_help: 'Com a linha do tempo, os posts continuam iguais aos do estilo padrão, mas uma linha vertical, como a do tema avocado, liga os avatares de um post ao outro, passa pelos avisos de evento e marca com um círculo os intervalos de tempo ("um mês depois"). A partir do tablet; no celular o post fica igual.'
      post_style_discourse: Padrão
      post_style_direct: Com a linha do tempo (estilo avocado)
      topic_reply_to_style_label: '"Em resposta a" nas postagens'
      post_username_first_label: Nome de usuário primeiro
      post_username_first_help: Nas postagens, o nome de usuário vem primeiro, em negrito, e o nome de exibição depois. Desligado, o nome de exibição vem primeiro.
      topic_reply_to_style_help: 'Como a postagem que responde a outra mostra a quem responde. No estilo padrão, "↩ Fulano" à direita do cabeçalho (só quando a respondida não é a de cima). No avocado, uma linha embaixo do nome, "↳ Em resposta a [avatar] Fulano", em toda resposta. O clique mostra a postagem respondida.'
      topic_reply_to_style_discourse: 'Padrão: ↩ nome à direita do cabeçalho'
      topic_reply_to_style_avocado: Linha abaixo do nome (estilo avocado)
      new_replies_bar_label: Aviso de respostas novas
      new_replies_bar_help: Quem está no meio da discussão quando chegam respostas em tempo real vê a barra "Há N novas respostas", que leva até elas.
      content_width_label: 'Largura do conteúdo'
