        limits_title: Mensagens, anexos e retenção
        needs_chat: Ligue o chat para configurar.
        realtime_on: As mensagens chegam em tempo real pelo websocket do flarum/realtime ("php flarum realtime:serve" precisa estar rodando). Se ele cair, o chat passa sozinho a perguntar ao servidor a cada poucos segundos.
        realtime_off: Sem o flarum/realtime, o chat pergunta ao servidor a cada poucos segundos se há mensagens novas. Funciona, mas com um pequeno atraso e mais requisições. Para tempo real, ative o flarum/realtime e rode "php flarum realtime:serve".
        retention_notice: A limpeza roda pelo agendador do Flarum ("php flarum schedule:run" no cron a cada minuto) e também apaga as imagens enviadas que nunca viraram mensagem.
        chars: caracteres
        days: dias
        chat_enabled_label: Chat
        chat_enabled_help: 'O chat do tema: canais públicos (avulsos ou de uma tag), mensagens diretas, fios, reações, menções e imagens, com o ícone no cabeçalho, a gaveta no canto da tela e a página /chat. Desligado, tudo some do fórum e a API responde como se o recurso não existisse; as mensagens ficam guardadas.'
        replaced_by_ramon_chat: "O ramon/chat está habilitado: ele substitui o chat do tema, que fica desligado. O tema adapta o visual e a barra lateral dele."
        chat_sidebar_label: Seções na barra lateral
        chat_sidebar_help: As seções "Canais" e "Mensagens diretas" na barra lateral, abaixo das tags, com as não lidas e as menções.
        chat_dm_enabled_label: Mensagens diretas
        chat_dm_enabled_help: Conversas privadas entre duas pessoas ou em grupo, abertas por "Nova mensagem" ou pelo botão "Chat" do perfil.
        chat_dm_max_users_label: Participantes por conversa
        chat_dm_max_users_help: O máximo de pessoas num chat em grupo, contando quem cria.
        chat_threads_enabled_label: Fios
        chat_threads_enabled_help: Responder a uma mensagem abre uma conversa à parte, no painel ao lado. Cada canal ainda liga ou desliga os fios nas configurações dele.
        chat_pins_enabled_label: Mensagens fixadas
        chat_pins_enabled_help: A moderação fixa até 20 mensagens por canal (numa MD, qualquer participante), que aparecem na faixa do topo da conversa.
        chat_max_message_length_label: Tamanho máximo da mensagem
        chat_max_message_length_help: Em caracteres. O padrão é 6000.
        chat_uploads_enabled_label: Imagens nas mensagens
        chat_uploads_enabled_help: O "+" do composer, colar e arrastar imagens (JPG, PNG, GIF e WebP), com a mesma validação do avatar. Ficam em public/assets/canela-chat.
        chat_upload_max_kb_label: Tamanho máximo da imagem
        chat_upload_max_kb_help: Por arquivo.
        chat_retention_days_label: Retenção dos canais
        chat_retention_days_help: Mensagens dos canais públicos mais velhas que isso são apagadas de vez, uma vez por dia. 0 guarda para sempre.
        chat_dm_retention_days_label: Retenção das mensagens diretas
        chat_dm_retention_days_help: O mesmo para as MDs. 0 guarda para sempre.
        chat_poll_seconds_label: Intervalo sem tempo real
        chat_poll_seconds_help: Sem o websocket, de quantos em quantos segundos a conversa aberta pergunta por mensagens novas.
