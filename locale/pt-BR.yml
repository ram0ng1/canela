      topic_sticky_avatar_help: 'Em posts longos, o avatar do autor acompanha a rolagem e fica visível até o fim do post, como no tema avocado. Só no computador.'
      topic_event_posts_label: Posts de evento
      topic_event_posts_help: Mostra na discussão os avisos do Flarum como "trancou a discussão" e "fixou a discussão".
      badges:
        section_manager: Gerenciar emblemas
        section_main: Emblemas e níveis de confiança
        badges_enabled_label: Emblemas
        badges_enabled_help: Os emblemas automáticos (Primeira curtida, Resposta interessante, Aniversário…), a página /badges, a aba Emblemas do perfil e a notificação "Ganhou …". Desligados, nada disso aparece e a API responde 404.
        badges_user_card_label: Emblemas no cartão do usuário
